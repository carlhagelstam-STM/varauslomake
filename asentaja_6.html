<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>STM Asentajanäkymä</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #1c1c1c;
    --surface: #2a2a2a;
    --surface2: #303131;
    --surface3: #3a3a3a;
    --border: #3f3f40;
    --border2: #4e4e4f;
    --text: #f0f0f0;
    --text2: #aaaaaa;
    --text3: #888586;
    --accent: #E50420;
    --accent-hover: #c4261b;
    --success: #2c901e;
    --success-light: #0d2210;
    --danger: #ff5126;
    --warning: #fbbf24;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  #auth-btn {
    background: var(--surface2); color: var(--text2);
    border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  #auth-btn.signed-in { color: var(--success); border-color: var(--success); }

  #nav-bar {
    position: sticky; top: 53px; z-index: 9;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; gap: 10px;
  }
  .nav-arrow {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border2);
    border-radius: var(--radius); width: 34px; height: 34px; font-size: 18px;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  #nav-label { flex: 1; text-align: center; font-weight: 700; font-size: 14px; }
  #view-toggle { display: flex; gap: 4px; flex-shrink: 0; }
  .view-btn {
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .day-heading {
    font-size: 12px; font-weight: 700; color: var(--text3); text-transform: uppercase;
    letter-spacing: 0.06em; margin: 18px 4px 8px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .day-heading:first-child { margin-top: 4px; padding-top: 0; border-top: none; }
  .day-empty { font-size: 13px; color: var(--text3); padding: 4px 4px 8px; }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  #status-msg {
    text-align: center; color: var(--text3); padding: 40px 16px; font-size: 14px;
  }
  #status-msg.error-msg { color: var(--danger); }
  #retry-btn {
    display: none; margin: 12px auto 0; background: var(--surface2);
    color: var(--text); border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 10px 16px; font-size: 14px; cursor: pointer;
  }

  .job-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px;
  }
  .job-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 10px;
  }
  .job-piste { font-weight: 700; font-size: 15px; }
  .job-date-inline { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .job-asiakaskoodi { color: var(--text); font-size: 16px; font-weight: 700; font-family: monospace; letter-spacing: 0.03em; margin-top: 2px; }
  .job-time {
    font-size: 20px; font-weight: 700; color: var(--text);
  }
  .job-meta {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; margin-bottom: 12px; font-size: 13px;
  }
  .tag {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; color: var(--text2);
  }
  .tag.rekisteri { color: var(--text); font-weight: 600; }
  .tag.has-note { color: var(--warning); border-color: var(--warning); }
  /* PLACEHOLDER-värit tyypeille — tarkista myöhemmin Airtablen oikeat värit ja päivitä */
  .tag.tyyppi-vaihto { background: #1a3a5c; border-color: #2563eb; color: #93c5fd; }
  .tag.tyyppi-korjaus { background: #0d2e2a; border-color: #0f6e56; color: #5eead4; }
  .tag.tyyppi-reklamaatio { background: #3a1414; border-color: #dc2626; color: #fca5a5; }
  .tag.tyyppi-muu { background: var(--surface2); border-color: var(--border2); color: var(--text2); }

  .badge-tyon-alla {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--success-light); color: var(--success);
    border: 1px solid var(--success);
    border-radius: var(--radius); padding: 10px 14px;
    font-size: 14px; font-weight: 600; width: 100%; justify-content: center;
  }

  .btn-aloita {
    width: 100%; padding: 12px 14px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: white; border: none;
    border-radius: var(--radius); cursor: pointer;
  }
  .btn-aloita:active { background: var(--accent-hover); }
  .btn-aloita:disabled { opacity: 0.5; cursor: default; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--surface3); color: var(--text); padding: 12px 18px;
    border-radius: var(--radius); font-size: 14px; opacity: 0;
    transition: all 0.25s ease; z-index: 100; max-width: 90%;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); color: white; }
  #toast.success { background: var(--success); color: white; }

  /* ── LISÄTIETOJA-POPUP ── */
  .lisatieto-popup-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
  }
  .lisatieto-popup {
    background: var(--surface); border: 1px solid var(--warning);
    border-radius: var(--radius-lg); padding: 20px; max-width: 400px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .lisatieto-popup-title {
    font-size: 15px; font-weight: 700; color: var(--warning); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .lisatieto-popup-text {
    font-size: 14px; color: var(--text); line-height: 1.5; margin-bottom: 16px;
    white-space: pre-wrap;
  }
  .lisatieto-popup-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .lp-close {
    background: var(--accent); color: white; border: none; border-radius: var(--radius);
    padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .lp-hide {
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>🔧 Asentajan työt</h1>
  <button id="auth-btn">Kirjaudu</button>
</header>

<div id="nav-bar">
  <button class="nav-arrow" id="nav-prev">‹</button>
  <div id="nav-label"></div>
  <button class="nav-arrow" id="nav-next">›</button>
  <div id="view-toggle">
    <button class="view-btn active" id="view-day">Päivä</button>
    <button class="view-btn" id="view-week">Viikko</button>
  </div>
</div>

<main>
  <div id="status-msg">Kirjaudu sisään nähdäksesi työt.</div>
  <button id="retry-btn">Kirjaudu uudelleen</button>
  <div id="job-list"></div>
</main>

<div id="toast"></div>

<script>
// ── ASETUKSET ─────────────────────────────────────────────────
const CLIENT_ID = '407173392975-daujo79fag2g1si9spljnv6vkct5ccqj.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/userinfo.email';
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwJD34dyJhcwvp0l2JDwCkB2cVgM2Ue9pWRYQ1jp9xh8z_k9maSv7bkt69ZJgfkc-pN/exec';

let accessToken = null;
let currentUserEmail = null;
let tokenClientRef = null;

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = ''; }, 3000);
}

// ── LISÄTIETOJA-POPUP ────────────────────────────────────────
function lisatietoOhitusAvain(email, tyoId) {
  return 'stm_lisatieto_ohita_' + (email || 'tuntematon') + '_' + tyoId;
}

// Sama popup, mutta AINA näytettävä (ei tarkista "älä näytä uudestaan"-asetusta) —
// käytetään kun asentaja itse painaa "Lisätietoja"-tagia nähdäkseen sen uudestaan.
function naytaLisatietoPopupPakotettu(teksti) {
  if (!teksti || !teksti.trim()) return;
  const overlay = document.createElement('div');
  overlay.className = 'lisatieto-popup-overlay';
  overlay.innerHTML = `
    <div class="lisatieto-popup">
      <div class="lisatieto-popup-title">📝 Lisätietoja tästä työstä</div>
      <div class="lisatieto-popup-text"></div>
      <div class="lisatieto-popup-actions">
        <button class="lp-close">Sulje</button>
      </div>
    </div>
  `;
  overlay.querySelector('.lisatieto-popup-text').textContent = teksti;
  document.body.appendChild(overlay);
  const poista = () => { if (overlay.parentNode) overlay.remove(); };
  overlay.querySelector('.lp-close').addEventListener('click', poista);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) poista(); });
}

function naytaLisatietoPopup(tyoId, teksti) {
  if (!teksti || !teksti.trim()) return;
  const avain = lisatietoOhitusAvain(currentUserEmail, tyoId);
  if (localStorage.getItem(avain) === '1') return;

  const overlay = document.createElement('div');
  overlay.className = 'lisatieto-popup-overlay';
  overlay.innerHTML = `
    <div class="lisatieto-popup">
      <div class="lisatieto-popup-title">📝 Lisätietoja tästä työstä</div>
      <div class="lisatieto-popup-text"></div>
      <div class="lisatieto-popup-actions">
        <button class="lp-close">Sulje</button>
        <button class="lp-hide">Älä näytä uudestaan</button>
      </div>
    </div>
  `;
  overlay.querySelector('.lisatieto-popup-text').textContent = teksti;
  document.body.appendChild(overlay);

  const poista = () => { if (overlay.parentNode) overlay.remove(); };
  const ajastin = setTimeout(poista, 15000);

  overlay.querySelector('.lp-close').addEventListener('click', () => { clearTimeout(ajastin); poista(); });
  overlay.querySelector('.lp-hide').addEventListener('click', () => {
    localStorage.setItem(avain, '1');
    clearTimeout(ajastin);
    poista();
  });
}

// ── KIRJAUTUMINEN ──────────────────────────────────────────────
function initGoogleAuth() {
  if (!window.google) { setTimeout(initGoogleAuth, 500); return; }
  tokenClientRef = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { showToast('Kirjautuminen epäonnistui: ' + resp.error, 'error'); return; }
      accessToken = resp.access_token;
      const btn = document.getElementById('auth-btn');
      btn.classList.add('signed-in');
      btn.textContent = 'Kirjautunut';
      document.getElementById('retry-btn').style.display = 'none';
      await haeOmaEmail();
      paivitaNavLabel();
      await lataaTyot();
    }
  });
  document.getElementById('auth-btn').addEventListener('click', () => {
    if (!accessToken) tokenClientRef.requestAccessToken({ prompt: '' });
  });
  document.getElementById('retry-btn').addEventListener('click', () => {
    tokenClientRef.requestAccessToken({ prompt: '' });
  });
}
initGoogleAuth();

async function haeOmaEmail() {
  try {
    const resp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { 'Authorization': 'Bearer ' + accessToken }
    });
    const data = await resp.json();
    currentUserEmail = (data.email || '').toLowerCase();
  } catch (e) {
    currentUserEmail = null;
  }
}

// ── PÄIVÄMÄÄRÄAPUFUNKTIOT ────────────────────────────────────
function fmtDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function lisaaPaivia(d, n) { const uusi = new Date(d); uusi.setDate(uusi.getDate() + n); return uusi; }
function maanantai(d) {
  const uusi = new Date(d);
  const vp = (uusi.getDay() + 6) % 7; // ma=0 ... su=6
  uusi.setDate(uusi.getDate() - vp);
  return uusi;
}

let currentView = 'day'; // 'day' tai 'week'
let currentDate = new Date();       // päivänäkymän valittu päivä
let currentWeekStart = maanantai(new Date()); // viikkonäkymän maanantai

function paivitaNavLabel() {
  const label = document.getElementById('nav-label');
  if (currentView === 'day') {
    label.textContent = currentDate.toLocaleDateString('fi-FI', { weekday: 'long', day: 'numeric', month: 'numeric' });
  } else {
    const su = lisaaPaivia(currentWeekStart, 6);
    label.textContent = currentWeekStart.toLocaleDateString('fi-FI', { day: 'numeric', month: 'numeric' })
      + ' – ' + su.toLocaleDateString('fi-FI', { day: 'numeric', month: 'numeric' });
  }
}

function vaihdaSuunta(suunta) {
  if (currentView === 'day') currentDate = lisaaPaivia(currentDate, suunta);
  else currentWeekStart = lisaaPaivia(currentWeekStart, suunta * 7);
  paivitaNavLabel();
  lataaTyot();
}

document.getElementById('nav-prev').addEventListener('click', () => vaihdaSuunta(-1));
document.getElementById('nav-next').addEventListener('click', () => vaihdaSuunta(1));
document.getElementById('view-day').addEventListener('click', () => vaihdaNakyma('day'));
document.getElementById('view-week').addEventListener('click', () => vaihdaNakyma('week'));

function vaihdaNakyma(nakyma) {
  currentView = nakyma;
  document.getElementById('view-day').classList.toggle('active', nakyma === 'day');
  document.getElementById('view-week').classList.toggle('active', nakyma === 'week');
  paivitaNavLabel();
  lataaTyot();
}

// Pyyhkäisy (mobiili): vasen = seuraava, oikea = edellinen
(function() {
  let alkuX = null, alkuY = null;
  const alue = document.getElementById('job-list');
  alue.addEventListener('touchstart', (e) => {
    alkuX = e.touches[0].clientX; alkuY = e.touches[0].clientY;
  }, { passive: true });
  alue.addEventListener('touchend', (e) => {
    if (alkuX === null) return;
    const dx = e.changedTouches[0].clientX - alkuX;
    const dy = e.changedTouches[0].clientY - alkuY;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      vaihdaSuunta(dx < 0 ? 1 : -1);
    }
    alkuX = null; alkuY = null;
  }, { passive: true });
})();

// ── HAE JA NÄYTÄ TYÖT ───────────────────────────────────────────
async function lataaTyot() {
  const statusEl = document.getElementById('status-msg');
  const listEl = document.getElementById('job-list');
  const retryBtn = document.getElementById('retry-btn');
  statusEl.style.display = 'block';
  statusEl.className = '';
  statusEl.textContent = 'Haetaan töitä...';
  retryBtn.style.display = 'none';
  listEl.innerHTML = '';

  const alku = currentView === 'day' ? fmtDate(currentDate) : fmtDate(currentWeekStart);
  const loppu = currentView === 'day' ? fmtDate(currentDate) : fmtDate(lisaaPaivia(currentWeekStart, 6));

  try {
    const url = WEBHOOK_URL + '?action=haeAsentajaTyot&token=' + encodeURIComponent(accessToken)
      + '&alku=' + alku + '&loppu=' + loppu;
    const resp = await fetch(url);
    const data = await resp.json();

    if (!data.ok) {
      statusEl.className = 'error-msg';
      statusEl.textContent = data.error || 'Tuntematon virhe';
      if ((data.error || '').includes('Kirjaudu')) retryBtn.style.display = 'block';
      return;
    }

    statusEl.style.display = 'none';

    if (currentView === 'day') {
      // Päivänäkymä: yksi tasainen lista, aikajärjestyksessä
      const tyot = data.tyot.slice().sort((a, b) => (a.kellonaika || '').localeCompare(b.kellonaika || ''));
      if (tyot.length === 0) {
        listEl.innerHTML = '<div class="day-empty">Ei töitä tälle päivälle.</div>';
      } else {
        tyot.forEach(tyo => listEl.appendChild(renderJobCard(tyo)));
      }
    } else {
      // Viikkonäkymä: ryhmitellään päivittäin, ma → su
      for (let i = 0; i < 7; i++) {
        const paiva = lisaaPaivia(currentWeekStart, i);
        const avain = fmtDate(paiva);
        const paivanTyot = data.tyot
          .filter(t => t.paivamaara && t.paivamaara.slice(0, 10) === avain)
          .sort((a, b) => (a.kellonaika || '').localeCompare(b.kellonaika || ''));

        const otsikko = document.createElement('div');
        otsikko.className = 'day-heading';
        otsikko.textContent = paiva.toLocaleDateString('fi-FI', { weekday: 'long', day: 'numeric', month: 'numeric' });
        listEl.appendChild(otsikko);

        if (paivanTyot.length === 0) {
          const tyhja = document.createElement('div');
          tyhja.className = 'day-empty';
          tyhja.textContent = 'Ei töitä.';
          listEl.appendChild(tyhja);
        } else {
          paivanTyot.forEach(tyo => listEl.appendChild(renderJobCard(tyo)));
        }
      }
    }

  } catch(e) {
    statusEl.className = 'error-msg';
    statusEl.textContent = 'Hakuvirhe: ' + e.message;
  }

}

function renderJobCard(tyo) {
  const card = document.createElement('div');
  card.className = 'job-card';

  const paivamaara = tyo.paivamaara ? new Date(tyo.paivamaara).toLocaleDateString('fi-FI', { weekday: 'short', day: 'numeric', month: 'numeric' }) : '';
  const onLisatietoja = tyo.lisatiedot && tyo.lisatiedot.trim();
  const tyyppiLuokka = 'tyyppi-' + (tyo.tyyppi || 'muu').toLowerCase();

  // HUOM: näkyvyystaso (suppea/keski/laaja) ei vielä vaikuta mihinkään —
  // tausta ei vielä hae mitään lisätietoja tasoittain. Rakenne on tässä
  // valmiina sitä varten kun päätetään mitä esim. "Laaja" oikeasti näyttäisi.
  card.innerHTML = `
    <div class="job-top">
      <div>
        <div class="job-piste">${tyo.piste}</div>
        ${tyo.asiakaskoodi ? `<div class="job-asiakaskoodi">${tyo.asiakaskoodi}</div>` : ''}
      </div>
      <div class="job-time">${paivamaara} ${tyo.kellonaika || ''}</div>
    </div>
    <div class="job-meta">
      <span class="tag ${tyyppiLuokka}">${tyo.tyyppi || ''}</span>
      ${tyo.rekisteri ? `<span class="tag rekisteri">${tyo.rekisteri}</span>` : ''}
      ${(tyo.merkki || tyo.malli) ? `<span class="tag">${[tyo.merkki, tyo.malli].filter(Boolean).join(' ')}</span>` : ''}
      ${(tyo.eurokoodi && (tyo.tyyppi || '').toLowerCase() === 'vaihto') ? `<span class="tag">🪟 ${tyo.eurokoodi}</span>` : ''}
      ${onLisatietoja ? `<span class="tag has-note" style="cursor:pointer;">📝 Lisätietoja</span>` : ''}
    </div>
    <div class="action-area" style="${tyo.tila === 'Työn alla' ? '' : 'display:none;'}"></div>
  `;

  const actionArea = card.querySelector('.action-area');
  const lisatietoTag = card.querySelector('.tag.has-note');
  if (lisatietoTag) {
    lisatietoTag.addEventListener('click', (e) => {
      e.stopPropagation();
      naytaLisatietoPopupPakotettu(tyo.lisatiedot);
    });
  }

  if (tyo.tila === 'Työn alla') {
    renderTyonAllaToiminnot(tyo, actionArea);
  } else if (tyo.tila === 'Valmis') {
    actionArea.style.display = 'block';
    actionArea.innerHTML = `<div class="badge-tyon-alla" style="background:var(--success-light); color:var(--success); border-color:var(--success);">✅ Valmis</div>`;
  } else if (tyo.tila === 'Poikkeama') {
    actionArea.style.display = 'block';
    actionArea.innerHTML = `<div class="badge-tyon-alla" style="background:rgba(255,81,38,0.12); color:var(--danger); border-color:var(--danger);">⚠️ Poikkeama ilmoitettu</div>`;
  } else {
    // Ei vielä aloitettu: koko rivi on kosketettava, avaa "Aloita työ" -osion.
    // TÄRKEÄÄ: tarkistetaan tyo.tila JOKA kerta kun riviä painetaan, ei vain
    // kerran alussa — muuten rivi "unohtaa" että työ on jo aloitettu/valmis
    // ja avaa vahingossa väärän napin uudestaan.
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => {
      if (tyo.tila === 'Työn alla' || tyo.tila === 'Valmis' || tyo.tila === 'Poikkeama') return;
      const auki = actionArea.style.display !== 'none';
      if (auki) { actionArea.style.display = 'none'; actionArea.innerHTML = ''; return; }
      actionArea.style.display = 'block';
      const btn = document.createElement('button');
      btn.className = 'btn-aloita';
      btn.textContent = 'Aloita työ →';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        naytaLisatietoPopup(tyo.id, tyo.lisatiedot);
        aloitaTyo(tyo.id, btn, actionArea, tyo);
      });
      actionArea.innerHTML = '';
      actionArea.appendChild(btn);
    });
  }

  return card;
}

// Näyttää "Työn alla" -badgen + Valmis/Poikkeama-napit

function renderTyonAllaToiminnot(tyo, actionArea) {
  actionArea.innerHTML = `
    <div class="badge-tyon-alla" style="margin-bottom:8px;">🔧 Työn alla</div>
    <div style="display:flex; gap:8px;">
      <button class="btn-valmis" style="flex:1; padding:10px; font-size:14px; font-weight:700; background:var(--success); color:white; border:none; border-radius:var(--radius); cursor:pointer;">✅ Valmis</button>
      <button class="btn-poikkeama" style="flex:1; padding:10px; font-size:14px; font-weight:700; background:transparent; color:var(--danger); border:1px solid var(--danger); border-radius:var(--radius); cursor:pointer;">⚠️ Poikkeama</button>
    </div>
    <div class="poikkeama-lomake" style="display:none; margin-top:10px;">
      <textarea class="poikkeama-teksti" placeholder="Kuvaile mitä meni pieleen..." style="width:100%; min-height:70px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:var(--radius); padding:8px; font-family:inherit; font-size:13px; resize:vertical;"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn-poikkeama-laheta" style="flex:1; padding:8px; font-size:13px; font-weight:700; background:var(--danger); color:white; border:none; border-radius:var(--radius); cursor:pointer;">Lähetä poikkeama</button>
        <button class="btn-poikkeama-peruuta" style="padding:8px 14px; font-size:13px; background:var(--surface3); color:var(--text2); border:none; border-radius:var(--radius); cursor:pointer;">Peruuta</button>
      </div>
    </div>
  `;

  actionArea.querySelector('.btn-valmis').addEventListener('click', (ev) => {
    ev.stopPropagation();
    merkitseValmiiksi(tyo, ev.target, actionArea);
  });

  const lomake = actionArea.querySelector('.poikkeama-lomake');
  actionArea.querySelector('.btn-poikkeama').addEventListener('click', (ev) => {
    ev.stopPropagation();
    lomake.style.display = lomake.style.display === 'none' ? 'block' : 'none';
  });
  actionArea.querySelector('.btn-poikkeama-peruuta').addEventListener('click', (ev) => {
    ev.stopPropagation();
    lomake.style.display = 'none';
  });
  actionArea.querySelector('.btn-poikkeama-laheta').addEventListener('click', (ev) => {
    ev.stopPropagation();
    const teksti = actionArea.querySelector('.poikkeama-teksti').value.trim();
    if (!teksti) { showToast('Kirjoita ensin kuvaus poikkeamasta', 'error'); return; }
    ilmoitaPoikkeama(tyo, teksti, ev.target, actionArea);
  });
}

async function aloitaTyo(id, btn, actionArea, tyo) {
  btn.disabled = true;
  btn.textContent = 'Aloitetaan...';
  try {
    const url = WEBHOOK_URL + '?action=aloitaTyo&id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(accessToken);
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.ok) {
      tyo.tila = 'Työn alla';
      actionArea.style.display = 'block';
      renderTyonAllaToiminnot(tyo, actionArea);
      showToast('Työ aloitettu', 'success');
    } else {
      showToast('Virhe: ' + (data.error || 'tuntematon'), 'error');
      btn.disabled = false;
      btn.textContent = 'Aloita työ →';
    }
  } catch(e) {
    showToast('Virhe: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Aloita työ →';
  }
}

async function merkitseValmiiksi(tyo, btn, actionArea) {
  btn.disabled = true;
  btn.textContent = 'Merkitään...';
  try {
    const url = WEBHOOK_URL + '?action=merkitseValmiiksi&id=' + encodeURIComponent(tyo.id) + '&token=' + encodeURIComponent(accessToken);
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.ok) {
      tyo.tila = 'Valmis';
      actionArea.innerHTML = `<div class="badge-tyon-alla" style="background:var(--success-light); color:var(--success); border-color:var(--success);">✅ Valmis</div>`;
      showToast('Työ merkitty valmiiksi', 'success');
    } else {
      showToast('Virhe: ' + (data.error || 'tuntematon'), 'error');
      btn.disabled = false;
      btn.textContent = '✅ Valmis';
    }
  } catch(e) {
    showToast('Virhe: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '✅ Valmis';
  }
}

async function ilmoitaPoikkeama(tyo, kuvaus, btn, actionArea) {
  btn.disabled = true;
  btn.textContent = 'Lähetetään...';
  try {
    const resp = await fetch(WEBHOOK_URL + '?action=ilmoitaPoikkeama', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ token: accessToken, id: tyo.id, kuvaus: kuvaus })
    });
    const data = await resp.json();
    if (data.ok) {
      tyo.tila = 'Poikkeama';
      actionArea.innerHTML = `<div class="badge-tyon-alla" style="background:rgba(255,81,38,0.12); color:var(--danger); border-color:var(--danger);">⚠️ Poikkeama ilmoitettu</div>`;
      showToast('Poikkeama ilmoitettu', 'success');
    } else {
      showToast('Virhe: ' + (data.error || 'tuntematon'), 'error');
      btn.disabled = false;
      btn.textContent = 'Lähetä poikkeama';
    }
  } catch(e) {
    showToast('Virhe: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Lähetä poikkeama';
  }
}
</script>
