<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Käyttäjähallinta – Suomen Tuulilasimestarit</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Titillium+Web:wght@400;600;700&display=swap');

  /* ── TUMMA TEEMA (oletus) ── */
  :root {
    --bg: #1c1c1c;
    --surface: #2a2a2a;
    --surface2: #303131;
    --surface3: #3a3a3a;
    --border: #3f3f40;
    --border2: #4e4e4f;
    --text: #f0f0f0;
    --text2: #aaaaaa;
    --text3: #888586;
    --accent: #E50420;
    --accent-hover: #c4261b;
    --accent-light: #2a0408;
    --success: #2c901e;
    --success-light: #0d2210;
    --danger: #ff5126;
    --radius: 8px;
    --radius-lg: 12px;
  }

  /* ── VAALEA TEEMA ── */
  body.light {
    --bg: #f0f0f0;
    --surface: #ffffff;
    --surface2: #f7f7f7;
    --surface3: #eeeeee;
    --border: #dddddd;
    --border2: #cccccc;
    --text: #1c1c1c;
    --text2: #555555;
    --text3: #888586;
    --accent: #E50420;
    --accent-hover: #c4261b;
    --accent-light: #ffbebe;
    --success: #2c901e;
    --success-light: #d0f1e8;
    --danger: #ff5126;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Manrope', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
    line-height: 1.7;
    letter-spacing: 0.01em;
    transition: background 0.2s, color 0.2s;
  }

  .page-header {
    max-width: 740px;
    margin: 0 auto 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    padding-bottom: 1.5rem;
    border-bottom: 2px solid var(--accent);
  }

  .logo-area h1 {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.03em;
  }
  .logo-area h1 span { color: var(--accent); }

  .logo-area p {
    font-size: 11px;
    color: var(--text3);
    margin-top: 2px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  #theme-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface2);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  #theme-btn:hover { border-color: var(--accent); background: var(--accent-light); }

  #auth-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  #auth-btn:hover { background: var(--surface3); color: var(--text); }
  #auth-btn.signed-in { color: var(--success); border-color: #065f46; background: var(--success-light); }

  .auth-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border2);
    flex-shrink: 0;
  }
  .auth-dot.green { background: var(--success); }

  .form-wrap {
    max-width: 740px;
    margin: 0 auto;
  }

  .intro {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 16px;
  }

  .signin-hint {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    text-align: center;
    color: var(--text2);
    font-size: 13px;
    margin-bottom: 10px;
  }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    margin-bottom: 10px;
  }

  .user-card-header {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .user-card-header .row { flex: 1; margin-bottom: 0; }

  .row { display: grid; gap: 10px; }
  .col-2 { grid-template-columns: 1fr 1fr; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .field input {
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    padding: 8px 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .field input::placeholder { color: var(--text3); }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(229,4,32,0.12);
    background: var(--surface3);
  }

  .checkbox-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .cb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    transition: all 0.12s;
  }
  .cb-item:hover { border-color: var(--accent); background: var(--accent-light); }
  .cb-item input[type="checkbox"] { display: none; }
  .cb-box {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 900;
    color: transparent;
    transition: all 0.12s;
    flex-shrink: 0;
  }
  .cb-item input[type="checkbox"]:checked + .cb-box {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .cb-item input[type="checkbox"]:checked + .cb-box::after { content: "\2715"; }
  .cb-item input[type="checkbox"]:checked + .cb-box + span { color: var(--accent); font-weight: 700; }
  .cb-item:hover .cb-box { border-color: var(--accent); }
  .cb-item span { font-size: 13px; color: var(--text); font-weight: 500; transition: all 0.12s; }

  .rm-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none;
    background: none;
    color: var(--text3);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.12s;
    line-height: 1;
    padding: 0;
    flex-shrink: 0;
  }
  .rm-btn:hover { background: rgba(248,113,113,0.1); color: var(--danger); }

  .add-row-btn {
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text3);
    background: none;
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    padding: 10px 18px;
    cursor: pointer;
    margin: 4px 0 14px;
    transition: all 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    width: 100%;
  }
  .add-row-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-light); }

  #save-btn {
    width: 100%;
    padding: 14px 24px;
    border-radius: var(--radius-lg);
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: 'Titillium Web', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s, background 0.15s;
    letter-spacing: 0.03em;
  }
  #save-btn:hover { background: var(--accent-hover); }
  #save-btn:active { transform: scale(0.99); }
  #save-btn:disabled { opacity: 0.35; cursor: not-allowed; background: var(--surface3); color: var(--text3); }

  .empty-state {
    text-align: center;
    color: var(--text3);
    font-size: 13px;
    padding: 24px 0;
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface3);
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 12px 24px;
    border-radius: var(--radius-lg);
    font-size: 13px;
    font-weight: 500;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 9999;
    white-space: nowrap;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success-light); border-color: #065f46; color: var(--success); }
  .toast.error { background: rgba(248,113,113,0.1); border-color: rgba(248,113,113,0.3); color: var(--danger); }

  @media (max-width: 560px) {
    .col-2 { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="logo-area">
    <h1>🪟 Suomen <span>Tuulilasi</span>mestarit</h1>
    <p>Käyttäjähallinta – kalenteripääsy</p>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <button id="theme-btn" onclick="toggleTheme()" title="Vaihda teema">
      <span id="theme-icon">☀️</span>
    </button>
    <button id="auth-btn">
      <span class="auth-dot" id="auth-dot"></span>
      <span id="auth-label">Kirjaudu Google-tilille</span>
    </button>
  </div>
</div>

<div class="form-wrap">

  <p class="intro">
    Merkitse rastilla, mihin asennuspisteisiin henkilöllä on oikeus tehdä varauksia.
    Muista painaa <strong>Tallenna muutokset</strong> lopuksi.
  </p>

  <div class="signin-hint" id="signin-hint">
    Kirjaudu Google-tilille yllä nähdäksesi ja muokataksesi käyttäjälistaa.
  </div>

  <div id="user-list"></div>

  <button class="add-row-btn" id="add-user-btn">+ Lisää henkilö</button>

  <button id="save-btn" disabled>💾 Kirjaudu ensin tallentaaksesi</button>

</div>

<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ============================================================
// ASETUKSET
// ============================================================
const CLIENT_ID = '407173392975-daujo79fag2g1si9spljnv6vkct5ccqj.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/drive.file';
const DATA_FOLDER = '1e8PffMwPOYBuTjAdCDGrZ3Q-Sv-08N36'; // Data-kansio Drivessa
const FILE_NAME = 'stm_kayttajat.json';

// Asennuspisteet - pidä sama kirjoitusasu kuin index_32.html:n CALENDAR_IDS-avaimissa
const LOCATIONS = ['Hatanpää','Kuopio','Lahti','Lempäälä','Lielahti','Pirkkala','Vantaa','Ylöjärvi'];

// Oletuskäyttäjät, jos tallennettua listaa ei vielä ole Drivessa
const DEFAULT_USERS = [
  { name: 'Turo', email: 'turo.tuulilasimestarit@gmail.com', locations: [...LOCATIONS] },
  { name: 'Leevi', email: 'leevimestarit@gmail.com', locations: [...LOCATIONS] },
];
// ============================================================

let accessToken = null;
let fileId = null; // Drive-tiedoston id, kun se on löytynyt/luotu

function escapeHtml(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// --- Käyttäjäkortin lisäys näkymään ---
function addUserCard(user) {
  user = user || { name: '', email: '', locations: [] };
  const card = document.createElement('div');
  card.className = 'section user-card';
  card.innerHTML = `
    <div class="user-card-header">
      <div class="row col-2">
        <div class="field">
          <label>Nimi</label>
          <input type="text" class="u-name" placeholder="Etu- ja sukunimi" value="${escapeHtml(user.name)}" />
        </div>
        <div class="field">
          <label>Sähköposti</label>
          <input type="email" class="u-email" placeholder="nimi@gmail.com" value="${escapeHtml(user.email)}" />
        </div>
      </div>
      <button class="rm-btn" title="Poista käyttäjä">×</button>
    </div>
    <div class="field" style="margin-top:10px;">
      <label>Kalenterit</label>
      <div class="checkbox-group">
        ${LOCATIONS.map(loc => `
          <label class="cb-item">
            <input type="checkbox" class="u-loc" data-loc="${loc}" ${user.locations.includes(loc) ? 'checked' : ''} />
            <span class="cb-box"></span>
            <span>${loc}</span>
          </label>
        `).join('')}
      </div>
    </div>
  `;
  card.querySelector('.rm-btn').addEventListener('click', () => {
    card.remove();
    updateEmptyState();
  });
  document.getElementById('user-list').appendChild(card);
  updateEmptyState();
}

function updateEmptyState() {
  const list = document.getElementById('user-list');
  let empty = document.getElementById('empty-state');
  if (list.children.length === 0) {
    if (!empty) {
      empty = document.createElement('div');
      empty.id = 'empty-state';
      empty.className = 'empty-state';
      empty.textContent = 'Ei käyttäjiä. Lisää ensimmäinen henkilö alla.';
      list.appendChild(empty);
    }
  } else if (empty) {
    empty.remove();
  }
}

document.getElementById('add-user-btn').addEventListener('click', () => addUserCard());

// --- Kortit -> taulukko tallennusta varten ---
function collectUsers() {
  const result = [];
  document.querySelectorAll('.user-card').forEach(card => {
    const name = card.querySelector('.u-name').value.trim();
    const email = card.querySelector('.u-email').value.trim();
    if (!name && !email) return; // ohita tyhjä rivi
    const locations = [];
    card.querySelectorAll('.u-loc:checked').forEach(cb => locations.push(cb.dataset.loc));
    result.push({ name, email, locations });
  });
  return result;
}

// --- Google-kirjautuminen ---
function initGoogleAuth() {
  if (!window.google) { setTimeout(initGoogleAuth, 300); return; }
  const authBtn = document.getElementById('auth-btn');
  const authDot = document.getElementById('auth-dot');
  const authLabel = document.getElementById('auth-label');
  const saveBtn = document.getElementById('save-btn');

  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { showToast('Kirjautuminen epäonnistui: ' + resp.error, 'error'); return; }
      accessToken = resp.access_token;
      authBtn.classList.add('signed-in');
      authDot.classList.add('green');
      authLabel.textContent = 'Google-tili yhdistetty';
      saveBtn.disabled = false;
      saveBtn.textContent = '💾 Tallenna muutokset';
      document.getElementById('signin-hint').style.display = 'none';
      await loadKayttajat();
    }
  });

  authBtn.addEventListener('click', () => {
    if (!accessToken) {
      tokenClient.requestAccessToken({ prompt: '' });
    } else {
      accessToken = null;
      fileId = null;
      authBtn.classList.remove('signed-in');
      authDot.classList.remove('green');
      authLabel.textContent = 'Kirjaudu Google-tilille';
      saveBtn.disabled = true;
      saveBtn.textContent = '💾 Kirjaudu ensin tallentaaksesi';
      document.getElementById('signin-hint').style.display = 'block';
      document.getElementById('user-list').innerHTML = '';
      updateEmptyState();
    }
  });
}
initGoogleAuth();

// --- Lataa käyttäjälista Drivesta ---
async function loadKayttajat() {
  document.getElementById('user-list').innerHTML = '';
  try {
    const q = `name='${FILE_NAME}' and '${DATA_FOLDER}' in parents and trashed=false`;
    const resp = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`, {
      headers: { Authorization: 'Bearer ' + accessToken }
    });
    const data = await resp.json();
    if (data.files && data.files.length) {
      fileId = data.files[0].id;
      const fileResp = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { Authorization: 'Bearer ' + accessToken }
      });
      const users = await fileResp.json();
      (Array.isArray(users) ? users : []).forEach(u => addUserCard(u));
      showToast('Käyttäjälista ladattu', 'success');
    } else {
      fileId = null;
      DEFAULT_USERS.forEach(u => addUserCard(u));
      showToast('Ei tallennettua listaa vielä – aloitetaan oletuksilla', '');
    }
  } catch (err) {
    DEFAULT_USERS.forEach(u => addUserCard(u));
    showToast('Lataus epäonnistui: ' + err.message, 'error');
  }
  updateEmptyState();
}

// --- Tallenna käyttäjälista Driveen ---
async function saveKayttajat() {
  if (!accessToken) { showToast('Kirjaudu ensin Google-tilille', 'error'); return; }
  const users = collectUsers();
  const blob = new Blob([JSON.stringify(users, null, 2)], { type: 'application/json' });
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'Tallennetaan...';

  try {
    if (fileId) {
      const resp = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: blob
      });
      if (!resp.ok) {
        const err = await resp.json();
        throw new Error(err.error?.message || 'Päivitys epäonnistui');
      }
    } else {
      const metadata = { name: FILE_NAME, parents: [DATA_FOLDER], mimeType: 'application/json' };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', blob);
      const resp = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + accessToken },
        body: form
      });
      const data = await resp.json();
      if (!data.id) throw new Error(data.error?.message || 'Tallennus epäonnistui');
      fileId = data.id;
    }
    showToast(`Tallennettu! (${users.length} käyttäjää)`, 'success');
  } catch (err) {
    showToast('Virhe: ' + err.message, 'error');
  }

  btn.disabled = false;
  btn.textContent = '💾 Tallenna muutokset';
}
document.getElementById('save-btn').addEventListener('click', saveKayttajat);

// --- Teeman vaihto (jaettu index_32.html:n kanssa localStoragen kautta) ---
function toggleTheme() {
  const isLight = document.body.classList.toggle('light');
  document.getElementById('theme-icon').textContent = isLight ? '🌙' : '☀️';
  localStorage.setItem('stm_theme', isLight ? 'light' : 'dark');
}
if (localStorage.getItem('stm_theme') === 'light') {
  document.body.classList.add('light');
  document.getElementById('theme-icon').textContent = '🌙';
}

updateEmptyState();
</script>
</body>
</html>
