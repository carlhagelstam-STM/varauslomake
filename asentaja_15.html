<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>STM Asentajanäkymä</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #1c1c1c;
    --surface: #2a2a2a;
    --surface2: #303131;
    --surface3: #3a3a3a;
    --border: #3f3f40;
    --border2: #4e4e4f;
    --text: #f0f0f0;
    --text2: #aaaaaa;
    --text3: #888586;
    --accent: #E50420;
    --accent-hover: #c4261b;
    --success: #2c901e;
    --success-light: #0d2210;
    --danger: #ff5126;
    --warning: #fbbf24;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  #auth-btn {
    background: var(--surface2); color: var(--text2);
    border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  #auth-btn.signed-in { color: var(--success); border-color: var(--success); }

  #nav-bar {
    position: sticky; top: 53px; z-index: 9;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .nav-arrow {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border2);
    border-radius: var(--radius); width: 34px; height: 34px; font-size: 18px;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  #nav-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 14px; min-width: 0; }
  #nav-label { font-weight: 700; font-size: 14px; white-space: nowrap; }
  #view-toggle { display: flex; gap: 4px; flex-shrink: 0; }
  .view-btn {
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

  .day-heading {
    font-size: 12px; font-weight: 700; color: var(--text3); text-transform: uppercase;
    letter-spacing: 0.06em; margin: 18px 4px 8px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .day-heading:first-child { margin-top: 4px; padding-top: 0; border-top: none; }
  .day-empty { font-size: 13px; color: var(--text3); padding: 4px 4px 8px; }

  .week-tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  .week-tile {
    width: 96px; padding: 8px; border-radius: var(--radius);
    border: 1px solid var(--border2); cursor: pointer; line-height: 1.3;
  }
  .week-tile-rek { font-size: 13px; font-weight: 700; }
  .week-tile-tyyppi { font-size: 11px; opacity: 0.85; }
  /* PLACEHOLDER-värit — tarkista myöhemmin Airtablen oikeat värit ja päivitä */
  .week-tile.tile-vaihto { background: #1a3a5c; border-color: #2563eb; color: #93c5fd; }
  .week-tile.tile-korjaus { background: #0d2e2a; border-color: #0f6e56; color: #5eead4; }
  .week-tile.tile-muu { background: var(--surface2); border-color: var(--border2); color: var(--text2); }
  .week-tile.tile-valmis { background: var(--success-light); border-color: var(--success); color: var(--success); }
  .week-tile.tile-poikkeama { background: rgba(255,81,38,0.12); border-color: var(--danger); color: var(--danger); }

  .tyo-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center; z-index: 300; padding: 16px;
  }
  .tyo-modal-wrap { position: relative; width: 100%; max-width: 420px; }
  .tyo-modal-close {
    position: absolute; top: -14px; right: -8px; width: 30px; height: 30px;
    border-radius: 50%; background: var(--surface3); color: var(--text); border: 1px solid var(--border2);
    font-size: 14px; cursor: pointer; z-index: 1;
  }

  /* ── KUVAUSNÄKYMÄ ── */
  .kuva-overlay {
    position: fixed; inset: 0; background: #000; z-index: 500;
    display: none; flex-direction: column;
  }
  .kuva-overlay.open { display: flex; }
  .kuva-topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: rgba(0,0,0,0.7); color: white;
    position: relative; z-index: 2; flex-shrink: 0;
  }
  .kuva-ohje-teksti { font-size: 16px; font-weight: 700; }
  .kuva-ohje-sub { font-size: 12px; color: #ccc; margin-top: 2px; }
  .kuva-sulje-btn {
    background: rgba(255,255,255,0.15); color: white; border: none;
    border-radius: 50%; width: 32px; height: 32px; font-size: 15px; cursor: pointer;
  }
  #kuva-video { flex: 1; min-height: 0; width: 100%; object-fit: cover; background: #111; }
  .kuva-controls {
    display: flex; align-items: center; justify-content: center; position: relative;
    flex-shrink: 0;
    padding: 22px; background: rgba(0,0,0,0.7);
  }
  .kuva-valmis-pieni {
    position: absolute; right: 20px; padding: 10px 16px; font-size: 13px; font-weight: 700;
    border-radius: var(--radius-lg); border: none; background: var(--success); color: white;
    cursor: pointer; display: none;
  }
  .kuva-valmis-pieni.show { display: block; }
  .kuva-shutter {
    width: 68px; height: 68px; border-radius: 50%;
    background: white; border: 4px solid #999; cursor: pointer;
    font-size: 28px; display: flex; align-items: center; justify-content: center;
  }
  .kuva-preview-grid {
    flex: 1; overflow-y: auto; padding: 12px; display: grid;
    grid-template-columns: repeat(3, 1fr); gap: 8px; align-content: start;
  }
  .kuva-preview-item {
    position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 3/4; background: #222;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  .kuva-preview-item img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; pointer-events: none;
  }
  .kuva-preview-label {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 6px;
    background: rgba(0,0,0,0.65); color: white; font-size: 10px; text-align: center;
  }
  .kuva-preview-controls { display: flex; gap: 10px; padding: 16px; background: rgba(0,0,0,0.85); }
  .kuva-preview-controls button { flex: 1; padding: 14px; font-size: 15px; font-weight: 700; border-radius: var(--radius-lg); border: none; cursor: pointer; }
  #preview-ota-uusi { background: rgba(255,81,38,0.15); color: var(--danger); border: 1px solid var(--danger) !important; }
  #preview-hyvaksy { background: var(--success); color: white; }

  .btn-kuvat {
    width: 100%; padding: 10px; margin-top: 8px; font-size: 14px; font-weight: 700;
    background: var(--surface2); color: var(--text); border: 1px solid var(--border2);
    border-radius: var(--radius); cursor: pointer;
  }
  .btn-kuvat.done { border-color: var(--success); color: var(--success); }

  main { padding: 16px; max-width: 640px; margin: 0 auto; }

  #status-msg {
    text-align: center; color: var(--text3); padding: 40px 16px; font-size: 14px;
  }
  #status-msg.error-msg { color: var(--danger); }
  #retry-btn {
    display: none; margin: 12px auto 0; background: var(--surface2);
    color: var(--text); border: 1px solid var(--border2); border-radius: var(--radius);
    padding: 10px 16px; font-size: 14px; cursor: pointer;
  }

  .job-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px;
  }
  .job-top {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; margin-bottom: 10px;
  }
  .job-piste { font-weight: 700; font-size: 15px; text-align: left; }
  .job-time-center { font-size: 20px; font-weight: 700; text-align: center; white-space: nowrap; }
  .job-asiakaskoodi {
    color: var(--text); font-size: 14px; font-weight: 700; font-family: monospace;
    letter-spacing: 0.03em; text-align: right;
  }
  .job-time {
    font-size: 20px; font-weight: 700; color: var(--text);
  }
  .job-meta {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; margin-bottom: 12px; font-size: 13px;
  }
  .tag {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; color: var(--text2);
  }
  .tag.rekisteri { color: var(--text); font-weight: 600; }
  .tag.has-note { color: var(--warning); border-color: var(--warning); }
  /* PLACEHOLDER-värit tyypeille — tarkista myöhemmin Airtablen oikeat värit ja päivitä */
  .tag.tyyppi-vaihto { background: #1a3a5c; border-color: #2563eb; color: #93c5fd; }
  .tag.tyyppi-korjaus { background: #0d2e2a; border-color: #0f6e56; color: #5eead4; }
  .tag.tyyppi-reklamaatio { background: #3a1414; border-color: #dc2626; color: #fca5a5; }
  .tag.tyyppi-muu { background: var(--surface2); border-color: var(--border2); color: var(--text2); }

  .badge-tyon-alla {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--success-light); color: var(--success);
    border: 1px solid var(--success);
    border-radius: var(--radius); padding: 10px 14px;
    font-size: 14px; font-weight: 600; width: 100%; justify-content: center;
  }

  .btn-aloita {
    width: 100%; padding: 12px 14px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: white; border: none;
    border-radius: var(--radius); cursor: pointer;
  }
  .btn-aloita:active { background: var(--accent-hover); }
  .btn-aloita:disabled { opacity: 0.5; cursor: default; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--surface3); color: var(--text); padding: 12px 18px;
    border-radius: var(--radius); font-size: 14px; opacity: 0;
    transition: all 0.25s ease; z-index: 100; max-width: 90%;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); color: white; }
  #toast.success { background: var(--success); color: white; }

  /* ── LISÄTIETOJA-POPUP ── */
  .lisatieto-popup-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 400; padding: 20px;
  }
  .lisatieto-popup {
    background: var(--surface); border: 1px solid var(--warning);
    border-radius: var(--radius-lg); padding: 20px; max-width: 400px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
  }
  .lisatieto-popup-title {
    font-size: 15px; font-weight: 700; color: var(--warning); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .lisatieto-popup-text {
    font-size: 14px; color: var(--text); line-height: 1.5; margin-bottom: 16px;
    white-space: pre-wrap;
  }
  .lisatieto-popup-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .lp-close {
    background: var(--accent); color: white; border: none; border-radius: var(--radius);
    padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .lp-hide {
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 8px 16px; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>🔧 Asentajan työt</h1>
  <button id="auth-btn">Kirjaudu</button>
</header>

<div id="nav-bar">
  <button class="nav-arrow" id="nav-prev">‹</button>
  <div id="nav-center">
    <div id="nav-label"></div>
    <div id="view-toggle">
      <button class="view-btn active" id="view-day">Päivä</button>
      <button class="view-btn" id="view-week">Viikko</button>
    </div>
  </div>
  <button class="nav-arrow" id="nav-next">›</button>
</div>

<main>
  <div id="status-msg">Kirjaudu sisään nähdäksesi työt.</div>
  <button id="retry-btn">Kirjaudu uudelleen</button>
  <div id="job-list"></div>
</main>

<div id="toast"></div>

<!-- ── KUVAUSNÄKYMÄ ── -->
<div id="kuva-overlay" class="kuva-overlay">
  <div class="kuva-topbar">
    <div>
      <div class="kuva-ohje-teksti" id="kuva-ohje-teksti">Kuva edestä</div>
      <div class="kuva-ohje-sub" id="kuva-ohje-sub">Kuva 1 / 6</div>
    </div>
    <button class="kuva-sulje-btn" id="kuva-sulje-btn">✕</button>
  </div>
  <video id="kuva-video" autoplay playsinline muted></video>
  <canvas id="kuva-canvas" style="display:none;"></canvas>
  <div class="kuva-controls" id="kuva-shutter-wrap">
    <button class="kuva-shutter" id="kuva-shutter-btn"></button>
    <button class="kuva-valmis-pieni" id="kuva-valmis-pieni">Valmis →</button>
  </div>
</div>

<!-- ── YKSITTÄISEN KUVAN SUURENNUS ── -->
<div id="kuva-suuri-overlay" class="kuva-overlay" style="z-index:600;">
  <div class="kuva-topbar">
    <div class="kuva-ohje-teksti" id="kuva-suuri-otsikko">Kuva</div>
    <button class="kuva-sulje-btn" id="kuva-suuri-sulje-btn">✕</button>
  </div>
  <div id="kuva-suuri-wrap" style="flex:1; overflow:auto; touch-action:pinch-zoom; display:flex; align-items:center; justify-content:center; background:#000;">
    <img id="kuva-suuri-img" draggable="false" oncontextmenu="return false" style="max-width:100%; max-height:100%; touch-action:pinch-zoom; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;" />
  </div>
  <div class="kuva-preview-controls">
    <button id="kuva-suuri-poista" style="background:var(--danger); color:white;">🗑 Poista</button>
    <button id="kuva-suuri-hyvaksy" style="background:var(--success); color:white;">✅ Hyväksy</button>
  </div>
</div>
<div id="kuva-preview-overlay" class="kuva-overlay">
  <div class="kuva-topbar">
    <div class="kuva-ohje-teksti" id="preview-otsikko">Esikatselu</div>
    <button class="kuva-sulje-btn" id="preview-sulje-btn">✕</button>
  </div>
  <div class="kuva-preview-grid" id="kuva-preview-grid"></div>
  <div class="kuva-preview-controls">
    <button id="preview-ota-uusi">🗑 Poista kaikki</button>
    <button id="preview-hyvaksy">✅ Hyväksy</button>
  </div>
</div>

<script>
// ── ASETUKSET ─────────────────────────────────────────────────
const CLIENT_ID = '407173392975-daujo79fag2g1si9spljnv6vkct5ccqj.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/userinfo.email';
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwJD34dyJhcwvp0l2JDwCkB2cVgM2Ue9pWRYQ1jp9xh8z_k9maSv7bkt69ZJgfkc-pN/exec';

let accessToken = null;
let currentUserEmail = null;
let tokenClientRef = null;

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = ''; }, 3000);
}

// ── LISÄTIETOJA-POPUP ────────────────────────────────────────
function lisatietoOhitusAvain(email, tyoId) {
  return 'stm_lisatieto_ohita_' + (email || 'tuntematon') + '_' + tyoId;
}

// Sama popup, mutta AINA näytettävä (ei tarkista "älä näytä uudestaan"-asetusta) —
// käytetään kun asentaja itse painaa "Lisätietoja"-tagia nähdäkseen sen uudestaan.
function naytaLisatietoPopupPakotettu(teksti) {
  if (!teksti || !teksti.trim()) return;
  const overlay = document.createElement('div');
  overlay.className = 'lisatieto-popup-overlay';
  overlay.innerHTML = `
    <div class="lisatieto-popup">
      <div class="lisatieto-popup-title">📝 Lisätietoja tästä työstä</div>
      <div class="lisatieto-popup-text"></div>
      <div class="lisatieto-popup-actions">
        <button class="lp-close">Sulje</button>
      </div>
    </div>
  `;
  overlay.querySelector('.lisatieto-popup-text').textContent = teksti;
  document.body.appendChild(overlay);
  const poista = () => { if (overlay.parentNode) overlay.remove(); };
  overlay.querySelector('.lp-close').addEventListener('click', poista);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) poista(); });
}

function naytaLisatietoPopup(tyoId, teksti) {
  if (!teksti || !teksti.trim()) return;
  const avain = lisatietoOhitusAvain(currentUserEmail, tyoId);
  if (localStorage.getItem(avain) === '1') return;

  const overlay = document.createElement('div');
  overlay.className = 'lisatieto-popup-overlay';
  overlay.innerHTML = `
    <div class="lisatieto-popup">
      <div class="lisatieto-popup-title">📝 Lisätietoja tästä työstä</div>
      <div class="lisatieto-popup-text"></div>
      <div class="lisatieto-popup-actions">
        <button class="lp-close">Sulje</button>
        <button class="lp-hide">Älä näytä uudestaan</button>
      </div>
    </div>
  `;
  overlay.querySelector('.lisatieto-popup-text').textContent = teksti;
  document.body.appendChild(overlay);

  const poista = () => { if (overlay.parentNode) overlay.remove(); };
  const ajastin = setTimeout(poista, 15000);

  overlay.querySelector('.lp-close').addEventListener('click', () => { clearTimeout(ajastin); poista(); });
  overlay.querySelector('.lp-hide').addEventListener('click', () => {
    localStorage.setItem(avain, '1');
    clearTimeout(ajastin);
    poista();
  });
}

// ── KIRJAUTUMINEN ──────────────────────────────────────────────
function initGoogleAuth() {
  if (!window.google) { setTimeout(initGoogleAuth, 500); return; }
  tokenClientRef = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { showToast('Kirjautuminen epäonnistui: ' + resp.error, 'error'); return; }
      accessToken = resp.access_token;
      const btn = document.getElementById('auth-btn');
      btn.classList.add('signed-in');
      btn.textContent = 'Kirjautunut';
      document.getElementById('retry-btn').style.display = 'none';
      await haeOmaEmail();
      paivitaNavLabel();
      await lataaTyot();
    }
  });
  document.getElementById('auth-btn').addEventListener('click', () => {
    if (!accessToken) tokenClientRef.requestAccessToken({ prompt: '' });
  });
  document.getElementById('retry-btn').addEventListener('click', () => {
    tokenClientRef.requestAccessToken({ prompt: '' });
  });
}
initGoogleAuth();

async function haeOmaEmail() {
  try {
    const resp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { 'Authorization': 'Bearer ' + accessToken }
    });
    const data = await resp.json();
    currentUserEmail = (data.email || '').toLowerCase();
  } catch (e) {
    currentUserEmail = null;
  }
}

// ── PÄIVÄMÄÄRÄAPUFUNKTIOT ────────────────────────────────────
function fmtDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function lisaaPaivia(d, n) { const uusi = new Date(d); uusi.setDate(uusi.getDate() + n); return uusi; }
function maanantai(d) {
  const uusi = new Date(d);
  const vp = (uusi.getDay() + 6) % 7; // ma=0 ... su=6
  uusi.setDate(uusi.getDate() - vp);
  return uusi;
}

let currentView = 'day'; // 'day' tai 'week'
let currentDate = new Date();       // päivänäkymän valittu päivä
let currentWeekStart = maanantai(new Date()); // viikkonäkymän maanantai

function paivitaNavLabel() {
  const label = document.getElementById('nav-label');
  if (currentView === 'day') {
    label.textContent = currentDate.toLocaleDateString('fi-FI', { weekday: 'long', day: 'numeric', month: 'numeric' });
  } else {
    const su = lisaaPaivia(currentWeekStart, 6);
    label.textContent = currentWeekStart.toLocaleDateString('fi-FI', { day: 'numeric', month: 'numeric' })
      + ' – ' + su.toLocaleDateString('fi-FI', { day: 'numeric', month: 'numeric' });
  }
}

function vaihdaSuunta(suunta) {
  if (currentView === 'day') currentDate = lisaaPaivia(currentDate, suunta);
  else currentWeekStart = lisaaPaivia(currentWeekStart, suunta * 7);
  paivitaNavLabel();
  lataaTyot();
}

document.getElementById('nav-prev').addEventListener('click', () => vaihdaSuunta(-1));
document.getElementById('nav-next').addEventListener('click', () => vaihdaSuunta(1));
document.getElementById('view-day').addEventListener('click', () => vaihdaNakyma('day'));
document.getElementById('view-week').addEventListener('click', () => vaihdaNakyma('week'));

function vaihdaNakyma(nakyma) {
  currentView = nakyma;
  document.getElementById('view-day').classList.toggle('active', nakyma === 'day');
  document.getElementById('view-week').classList.toggle('active', nakyma === 'week');
  paivitaNavLabel();
  lataaTyot();
}

// ── HAE JA NÄYTÄ TYÖT ───────────────────────────────────────────
let lataaTyotPyyntoId = 0; // kasvava tunniste — vain viimeisin haku saa piirtää

async function lataaTyot() {
  const omaPyyntoId = ++lataaTyotPyyntoId;

  const statusEl = document.getElementById('status-msg');
  const listEl = document.getElementById('job-list');
  const retryBtn = document.getElementById('retry-btn');
  statusEl.style.display = 'block';
  statusEl.className = '';
  statusEl.textContent = 'Haetaan töitä...';
  retryBtn.style.display = 'none';
  listEl.innerHTML = '';

  const alku = currentView === 'day' ? fmtDate(currentDate) : fmtDate(currentWeekStart);
  const loppu = currentView === 'day' ? fmtDate(currentDate) : fmtDate(lisaaPaivia(currentWeekStart, 6));

  try {
    const url = WEBHOOK_URL + '?action=haeAsentajaTyot&token=' + encodeURIComponent(accessToken)
      + '&alku=' + alku + '&loppu=' + loppu;
    const resp = await fetch(url);
    const data = await resp.json();

    // Jos joku uudempi haku on ehtinyt käynnistyä sillä aikaa kun tämä odotti
    // vastausta, hylätään tämä hiljaisesti — ei piirretä vanhentunutta dataa.
    if (omaPyyntoId !== lataaTyotPyyntoId) return;

    if (!data.ok) {
      statusEl.className = 'error-msg';
      statusEl.textContent = data.error || 'Tuntematon virhe';
      if ((data.error || '').includes('Kirjaudu')) retryBtn.style.display = 'block';
      return;
    }

    statusEl.style.display = 'none';
    listEl.innerHTML = ''; // varmistetaan vielä kerran tyhjä pohja juuri ennen piirtoa

    if (currentView === 'day') {
      // Päivänäkymä: yksi tasainen lista, aikajärjestyksessä
      const tyot = data.tyot.slice().sort((a, b) => (a.kellonaika || '').localeCompare(b.kellonaika || ''));
      if (tyot.length === 0) {
        listEl.innerHTML = '<div class="day-empty">Ei töitä tälle päivälle.</div>';
      } else {
        tyot.forEach(tyo => listEl.appendChild(renderJobCard(tyo)));
      }
    } else {
      // Viikkonäkymä: ryhmitellään päivittäin, ma → su
      for (let i = 0; i < 7; i++) {
        const paiva = lisaaPaivia(currentWeekStart, i);
        const avain = fmtDate(paiva);
        const paivanTyot = data.tyot
          .filter(t => t.paivamaara && t.paivamaara.slice(0, 10) === avain)
          .sort((a, b) => (a.kellonaika || '').localeCompare(b.kellonaika || ''));

        const otsikko = document.createElement('div');
        otsikko.className = 'day-heading';
        otsikko.textContent = paiva.toLocaleDateString('fi-FI', { weekday: 'long', day: 'numeric', month: 'numeric' });
        listEl.appendChild(otsikko);

        if (paivanTyot.length === 0) {
          const tyhja = document.createElement('div');
          tyhja.className = 'day-empty';
          tyhja.textContent = 'Ei töitä.';
          listEl.appendChild(tyhja);
        } else {
          const rivi = document.createElement('div');
          rivi.className = 'week-tiles';
          paivanTyot.forEach(tyo => rivi.appendChild(renderJobTile(tyo)));
          listEl.appendChild(rivi);
        }
      }
    }

  } catch(e) {
    if (omaPyyntoId !== lataaTyotPyyntoId) return;
    statusEl.className = 'error-msg';
    statusEl.textContent = 'Hakuvirhe: ' + e.message;
  }

}

// ── KUVAUSNÄKYMÄ (OSA 1: kamera + esikatselu, EI VIELÄ Drive-tallennusta) ──
const PAKOLLISET_KUVAT = [
  { id: 'edesta',      label: 'Kuva edestä' },
  { id: 'kuljettaja',  label: 'Kuva kuljettaja' },
  { id: 'takaa',       label: 'Kuva takaa' },
  { id: 'matkustaja',  label: 'Kuva matkustaja' },
  { id: 'vaurio_1',    label: 'Kuva vaurio 1' },
  { id: 'vaurio_2',    label: 'Kuva vaurio 2' },
];

let kuvaTyo = null;          // mille työlle kuvataan
let kuvaVideoStream = null;
let kuvaLisaCounter = 3;      // seuraava "Vaurio_N" lisäkuvan numero
let kuvatOtetut = [];         // [{id, label, dataUrl}]
let kuvaSijainti = null;      // {lat, lng} tai null
let kuvaSijaintiKysytty = false;

// Palauttaa ensimmäisen puuttuvan pakollisen kuvan, tai null jos kaikki on jo otettu.
// Presence-pohjainen (ei pelkkä laskuri), jotta yksittäisen kuvan poisto ja
// uusinta toimivat oikein, vaikka muut kuvat olisi jo otettu.
function seuraavaPakollinen() {
  return PAKOLLISET_KUVAT.find(p => !kuvatOtetut.some(k => k.id === p.id)) || null;
}
function kaikkiPakollisetOtettu() {
  return seuraavaPakollinen() === null;
}

function paivitaKuvaOhje() {
  const ohje = document.getElementById('kuva-ohje-teksti');
  const sub = document.getElementById('kuva-ohje-sub');
  const valmisPieni = document.getElementById('kuva-valmis-pieni');
  const puuttuva = seuraavaPakollinen();

  if (puuttuva) {
    const otettuja = PAKOLLISET_KUVAT.length - PAKOLLISET_KUVAT.filter(p => !kuvatOtetut.some(k => k.id === p.id)).length;
    ohje.textContent = puuttuva.label;
    sub.textContent = `Kuva ${otettuja + 1} / ${PAKOLLISET_KUVAT.length}`;
    valmisPieni.classList.remove('show');
  } else {
    ohje.textContent = 'Lisäkuva (vapaaehtoinen)';
    sub.textContent = `${kuvatOtetut.length} kuvaa otettu yhteensä`;
    valmisPieni.classList.add('show');
  }
}

async function avaaKuvausNakyma(tyo, sailytaOlemassaOlevat) {
  kuvaTyo = tyo;
  kuvaLisaCounter = 3;
  if (!sailytaOlemassaOlevat) kuvatOtetut = [];

  // Sijaintilupa kysytään kertaalleen per kuvauskerta
  if (!kuvaSijaintiKysytty) {
    kuvaSijaintiKysytty = true;
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => { kuvaSijainti = { lat: pos.coords.latitude, lng: pos.coords.longitude }; },
        (err) => { console.warn('Sijaintia ei saatu:', err.message); kuvaSijainti = null; },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }
  }

  document.getElementById('kuva-overlay').classList.add('open');
  paivitaKuvaOhje();

  try {
    kuvaVideoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    document.getElementById('kuva-video').srcObject = kuvaVideoStream;
  } catch (e) {
    showToast('Kameraa ei saatu käyttöön: ' + e.message, 'error');
    suljeKuvausNakyma();
  }
}

function suljeKuvausNakyma() {
  if (kuvaVideoStream) {
    kuvaVideoStream.getTracks().forEach(t => t.stop());
    kuvaVideoStream = null;
  }
  document.getElementById('kuva-overlay').classList.remove('open');
}

function otaKuva() {
  const video = document.getElementById('kuva-video');
  const canvas = document.getElementById('kuva-canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);

  // Pienennetään max 1600px pisimmältä sivulta, jotta tiedostokoko pysyy
  // pienenä mutta laatu riittää dokumentointiin.
  const MAX_SIVU = 1600;
  let w = canvas.width, h = canvas.height;
  if (Math.max(w, h) > MAX_SIVU) {
    const kerroin = MAX_SIVU / Math.max(w, h);
    w = Math.round(w * kerroin);
    h = Math.round(h * kerroin);
  }
  const pienCanvas = document.createElement('canvas');
  pienCanvas.width = w; pienCanvas.height = h;
  pienCanvas.getContext('2d').drawImage(canvas, 0, 0, w, h);
  const dataUrl = pienCanvas.toDataURL('image/jpeg', 0.8);

  const puuttuva = seuraavaPakollinen();
  let kuvaTieto;
  if (puuttuva) {
    kuvaTieto = { ...puuttuva, dataUrl };
  } else {
    kuvaTieto = { id: 'vaurio_' + kuvaLisaCounter, label: 'Vaurio ' + kuvaLisaCounter, dataUrl };
    kuvaLisaCounter++;
  }
  kuvatOtetut.push(kuvaTieto);
  paivitaKuvaOhje();
}

document.getElementById('kuva-shutter-btn').addEventListener('click', otaKuva);
document.getElementById('kuva-sulje-btn').addEventListener('click', suljeKuvausNakyma);

document.getElementById('kuva-valmis-pieni').addEventListener('click', () => {
  suljeKuvausNakyma();
  avaaEsikatselu();
});

function avaaEsikatselu() {
  const grid = document.getElementById('kuva-preview-grid');
  document.getElementById('preview-otsikko').textContent = `Esikatselu (${kuvatOtetut.length} kuvaa)`;
  grid.innerHTML = '';
  kuvatOtetut.forEach((k, idx) => {
    const item = document.createElement('div');
    item.className = 'kuva-preview-item';
    item.style.cursor = 'pointer';
    item.innerHTML = `<img src="${k.dataUrl}" draggable="false" oncontextmenu="return false" /><div class="kuva-preview-label">${k.label}</div>`;
    item.addEventListener('click', () => avaaKuvaSuurena(idx));
    grid.appendChild(item);
  });
  document.getElementById('kuva-preview-overlay').classList.add('open');
  paivitaHyvaksyNappi();
}

// Näyttää Hyväksy-napin vain jos kaikki 6 pakollista kuvaa on otettu —
// muuten se piilotetaan, ettei työtä voi vahingossa hyväksyä kesken.
function paivitaHyvaksyNappi() {
  const btn = document.getElementById('preview-hyvaksy');
  btn.style.display = kaikkiPakollisetOtettu() ? 'block' : 'none';
}

document.getElementById('preview-sulje-btn').addEventListener('click', () => {
  document.getElementById('kuva-preview-overlay').classList.remove('open');
});

document.getElementById('preview-ota-uusi').addEventListener('click', () => {
  document.getElementById('kuva-preview-overlay').classList.remove('open');
  avaaKuvausNakyma(kuvaTyo, false); // false = aloita täysin alusta
});

document.getElementById('preview-hyvaksy').addEventListener('click', async () => {
  if (!kuvaTyo) return;
  const btn = document.getElementById('preview-hyvaksy');
  const perusteksti = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Tallennetaan...';

  try {
    const resp = await fetch(WEBHOOK_URL + '?action=tallennaKuvat', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        token: accessToken,
        id: kuvaTyo.id,
        rekisteri: kuvaTyo.rekisteri || '',
        asiakaskoodi: kuvaTyo.asiakaskoodi || '',
        sijainti: kuvaSijainti,
        kuvat: kuvatOtetut.map(k => ({ id: k.id, dataUrl: k.dataUrl })),
      })
    });
    const data = await resp.json();

    if (data.ok) {
      kuvaTyo.kuvat = kuvatOtetut.slice();
      kuvaTyo.kuvatHyvaksytty = true;
      kuvaTyo.kuvatTallennettu = true;
      kuvaTyo.kuvatLinkki = data.kansioLinkki;
      document.getElementById('kuva-preview-overlay').classList.remove('open');
      showToast(`${data.tallennettu} kuvaa tallennettu Driveen`, 'success');
      paivitaKuvatNappi();
    } else {
      showToast('⚠️ Kuvien tallennus epäonnistui: ' + (data.error || 'tuntematon virhe'), 'error');
    }
  } catch (e) {
    showToast('⚠️ Kuvien tallennusvirhe: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = perusteksti;
  }
});

// ── YKSITTÄISEN KUVAN SUURENNUS, ZOOMAUS JA POISTO ──────────────
let kuvaSuuriIndex = null;

function avaaKuvaSuurena(idx) {
  kuvaSuuriIndex = idx;
  const k = kuvatOtetut[idx];
  document.getElementById('kuva-suuri-otsikko').textContent = k.label;
  document.getElementById('kuva-suuri-img').src = k.dataUrl;
  document.getElementById('kuva-suuri-overlay').classList.add('open');
}

document.getElementById('kuva-suuri-sulje-btn').addEventListener('click', () => {
  document.getElementById('kuva-suuri-overlay').classList.remove('open');
});
document.getElementById('kuva-suuri-hyvaksy').addEventListener('click', () => {
  document.getElementById('kuva-suuri-overlay').classList.remove('open');
});

document.getElementById('kuva-suuri-poista').addEventListener('click', () => {
  if (kuvaSuuriIndex === null) return;
  const poistettava = kuvatOtetut[kuvaSuuriIndex];
  const oliPakollinen = PAKOLLISET_KUVAT.some(p => p.id === poistettava.id);
  kuvatOtetut.splice(kuvaSuuriIndex, 1);
  document.getElementById('kuva-suuri-overlay').classList.remove('open');

  if (oliPakollinen) {
    // Pakollinen kuva poistettu: puhelin pyytää ottamaan sen uudestaan —
    // avataan kamera suoraan, säilyttäen jo otetut muut kuvat.
    document.getElementById('kuva-preview-overlay').classList.remove('open');
    showToast('Pakollinen kuva poistettu — ota se uudestaan', '');
    avaaKuvausNakyma(kuvaTyo, true); // true = säilytä muut jo otetut kuvat
  } else {
    // Ylimääräinen kuva: riittää päivittää esikatselu paikallaan
    avaaEsikatselu();
  }
});

function paivitaKuvatNappi() {
  const btn = document.getElementById('kuvat-nappi');
  if (!btn || !kuvaTyo) return;
  if (kuvaTyo.kuvatTallennettu) {
    btn.textContent = `📷 Kuvat (${(kuvaTyo.kuvat || []).length}) tallennettu ✓ — katso/uusi`;
    btn.classList.add('done');
  } else if (kuvaTyo.kuvatHyvaksytty) {
    btn.textContent = `📷 Kuvat (${(kuvaTyo.kuvat || []).length}) — ei vielä tallennettu`;
    btn.classList.remove('done');
  } else {
    btn.textContent = '📷 Ota kuvat';
    btn.classList.remove('done');
  }
}

// Avaa kuvien katselun/uusimisen napista: jos työllä on jo hyväksyttyjä
// kuvia, näytetään ne suoraan esikatselussa (ei tarvitse avata kameraa
// ensin) — käyttäjä voi sieltä painaa "Ota uusi" jos haluaa kuvata uudestaan.
function avaaKuvatNapista(tyo) {
  kuvaTyo = tyo;
  if (tyo.kuvatHyvaksytty && tyo.kuvat && tyo.kuvat.length) {
    kuvatOtetut = tyo.kuvat.slice();
    avaaEsikatselu();
  } else {
    avaaKuvausNakyma(tyo);
  }
}



// PLACEHOLDER-värit tile-luokissa — tarkista myöhemmin Airtablen oikeat
// värit ja päivitä CSS vastaamaan. "Laskutettu"-tilaa ei vielä ole
// olemassa Airtablessa, joten sitä ei voida värittää vielä.
function tilaLuokka(tyo) {
  if (tyo.tila === 'Valmis') return 'tile-valmis';
  if (tyo.tila === 'Poikkeama') return 'tile-poikkeama';
  const t = (tyo.tyyppi || '').toLowerCase();
  if (t === 'vaihto') return 'tile-vaihto';
  if (t === 'korjaus') return 'tile-korjaus';
  return 'tile-muu';
}

function renderJobTile(tyo) {
  const tile = document.createElement('div');
  tile.className = 'week-tile ' + tilaLuokka(tyo);
  const alarivi = tyo.tila === 'Valmis' ? 'Valmis' : (tyo.tila === 'Poikkeama' ? 'Poikkeama' : (tyo.tyyppi || ''));
  tile.innerHTML = `
    <div class="week-tile-rek">${tyo.rekisteri || '—'}</div>
    <div class="week-tile-tyyppi">${alarivi}</div>
  `;
  tile.addEventListener('click', () => avaaTyoModal(tyo));
  return tile;
}

function avaaTyoModal(tyo) {
  const overlay = document.createElement('div');
  overlay.className = 'tyo-modal-overlay';
  const wrap = document.createElement('div');
  wrap.className = 'tyo-modal-wrap';
  const closeBtn = document.createElement('button');
  closeBtn.className = 'tyo-modal-close';
  closeBtn.textContent = '✕';
  closeBtn.addEventListener('click', () => overlay.remove());
  wrap.appendChild(closeBtn);
  wrap.appendChild(renderJobCard(tyo));
  overlay.appendChild(wrap);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function renderJobCard(tyo) {
  const card = document.createElement('div');
  card.className = 'job-card';

  const onLisatietoja = tyo.lisatiedot && tyo.lisatiedot.trim();
  const tyyppiLuokka = 'tyyppi-' + (tyo.tyyppi || 'muu').toLowerCase();

  // HUOM: näkyvyystaso (suppea/keski/laaja) ei vielä vaikuta mihinkään —
  // tausta ei vielä hae mitään lisätietoja tasoittain. Rakenne on tässä
  // valmiina sitä varten kun päätetään mitä esim. "Laaja" oikeasti näyttäisi.
  card.innerHTML = `
    <div class="job-top">
      <div class="job-piste">${tyo.piste}</div>
      <div class="job-time-center">${tyo.kellonaika || ''}</div>
      <div class="job-asiakaskoodi">${tyo.asiakaskoodi || ''}</div>
    </div>
    <div class="job-meta">
      <span class="tag ${tyyppiLuokka}">${tyo.tyyppi || ''}</span>
      ${tyo.rekisteri ? `<span class="tag rekisteri">${tyo.rekisteri}</span>` : ''}
      ${(tyo.merkki || tyo.malli) ? `<span class="tag">${[tyo.merkki, tyo.malli].filter(Boolean).join(' ')}</span>` : ''}
      ${(tyo.eurokoodi && (tyo.tyyppi || '').toLowerCase() === 'vaihto') ? `<span class="tag">🪟 ${tyo.eurokoodi}</span>` : ''}
      ${onLisatietoja ? `<span class="tag has-note" style="cursor:pointer;">📝 Lisätietoja</span>` : ''}
    </div>
    <div class="action-area" style="${tyo.tila === 'Työn alla' ? '' : 'display:none;'}"></div>
  `;

  const actionArea = card.querySelector('.action-area');
  const lisatietoTag = card.querySelector('.tag.has-note');
  if (lisatietoTag) {
    lisatietoTag.addEventListener('click', (e) => {
      e.stopPropagation();
      naytaLisatietoPopupPakotettu(tyo.lisatiedot);
    });
  }

  if (tyo.tila === 'Työn alla') {
    renderTyonAllaToiminnot(tyo, actionArea);
  } else if (tyo.tila === 'Valmis') {
    actionArea.style.display = 'block';
    actionArea.innerHTML = `<div class="badge-tyon-alla" style="background:var(--success-light); color:var(--success); border-color:var(--success);">✅ Valmis</div>`;
  } else if (tyo.tila === 'Poikkeama') {
    actionArea.style.display = 'block';
    actionArea.innerHTML = `<div class="badge-tyon-alla" style="background:rgba(255,81,38,0.12); color:var(--danger); border-color:var(--danger);">⚠️ Poikkeama ilmoitettu</div>`;
  } else {
    // Ei vielä aloitettu: koko rivi on kosketettava, avaa "Aloita työ" -osion.
    // TÄRKEÄÄ: tarkistetaan tyo.tila JOKA kerta kun riviä painetaan, ei vain
    // kerran alussa — muuten rivi "unohtaa" että työ on jo aloitettu/valmis
    // ja avaa vahingossa väärän napin uudestaan.
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => {
      if (tyo.tila === 'Työn alla' || tyo.tila === 'Valmis' || tyo.tila === 'Poikkeama') return;
      const auki = actionArea.style.display !== 'none';
      if (auki) { actionArea.style.display = 'none'; actionArea.innerHTML = ''; return; }
      actionArea.style.display = 'block';
      const btn = document.createElement('button');
      btn.className = 'btn-aloita';
      btn.textContent = 'Aloita työ →';
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        naytaLisatietoPopup(tyo.id, tyo.lisatiedot);
        aloitaTyo(tyo.id, btn, actionArea, tyo);
      });
      actionArea.innerHTML = '';
      actionArea.appendChild(btn);
    });
  }

  return card;
}

// Näyttää "Työn alla" -badgen + Valmis/Poikkeama-napit

function renderTyonAllaToiminnot(tyo, actionArea) {
  actionArea.innerHTML = `
    <div class="badge-tyon-alla" style="margin-bottom:8px;">🔧 Työn alla</div>
    <button class="btn-kuvat" id="kuvat-nappi">📷 Ota kuvat</button>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button class="btn-valmis" style="flex:1; padding:10px; font-size:14px; font-weight:700; background:var(--success); color:white; border:none; border-radius:var(--radius); cursor:pointer;">✅ Valmis</button>
      <button class="btn-poikkeama" style="flex:1; padding:10px; font-size:14px; font-weight:700; background:transparent; color:var(--danger); border:1px solid var(--danger); border-radius:var(--radius); cursor:pointer;">⚠️ Poikkeama</button>
    </div>
    <div class="poikkeama-lomake" style="display:none; margin-top:10px;">
      <textarea class="poikkeama-teksti" placeholder="Kuvaile mitä meni pieleen..." style="width:100%; min-height:70px; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:var(--radius); padding:8px; font-family:inherit; font-size:13px; resize:vertical;"></textarea>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn-poikkeama-laheta" style="flex:1; padding:8px; font-size:13px; font-weight:700; background:var(--danger); color:white; border:none; border-radius:var(--radius); cursor:pointer;">Lähetä poikkeama</button>
        <button class="btn-poikkeama-peruuta" style="padding:8px 14px; font-size:13px; background:var(--surface3); color:var(--text2); border:none; border-radius:var(--radius); cursor:pointer;">Peruuta</button>
      </div>
    </div>
  `;

  actionArea.querySelector('#kuvat-nappi').addEventListener('click', (ev) => {
    ev.stopPropagation();
    avaaKuvatNapista(tyo);
  });
  kuvaTyo = tyo;
  paivitaKuvatNappi();

  actionArea.querySelector('.btn-valmis').addEventListener('click', (ev) => {
    ev.stopPropagation();
    if (!tyo.kuvatTallennettu) {
      showToast('⚠️ Ota ja tallenna kuvat ensin ennen kuin merkitset työn valmiiksi', 'error');
      return;
    }
    merkitseValmiiksi(tyo, ev.target, actionArea);
  });

  const lomake = actionArea.querySelector('.poikkeama-lomake');
  actionArea.querySelector('.btn-poikkeama').addEventListener('click', (ev) => {
    ev.stopPropagation();
    lomake.style.display = lomake.style.display === 'none' ? 'block' : 'none';
  });
  actionArea.querySelector('.btn-poikkeama-peruuta').addEventListener('click', (ev) => {
    ev.stopPropagation();
    lomake.style.display = 'none';
  });
  actionArea.querySelector('.btn-poikkeama-laheta').addEventListener('click', (ev) => {
    ev.stopPropagation();
    const teksti = actionArea.querySelector('.poikkeama-teksti').value.trim();
    if (!teksti) { showToast('Kirjoita ensin kuvaus poikkeamasta', 'error'); return; }
    ilmoitaPoikkeama(tyo, teksti, ev.target, actionArea);
  });
}

async function aloitaTyo(id, btn, actionArea, tyo) {
  btn.disabled = true;
  btn.textContent = 'Aloitetaan...';
  try {
    const url = WEBHOOK_URL + '?action=aloitaTyo&id=' + encodeURIComponent(id) + '&token=' + encodeURIComponent(accessToken);
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.ok) {
      tyo.tila = 'Työn alla';
      actionArea.style.display = 'block';
      renderTyonAllaToiminnot(tyo, actionArea);
      showToast('Työ aloitettu', 'success');
      avaaKuvausNakyma(tyo);
    } else {
      showToast('Virhe: ' + (data.error || 'tuntematon'), 'error');
      btn.disabled = false;
      btn.textContent = 'Aloita työ →';
    }
  } catch(e) {
    showToast('Virhe: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Aloita työ →';
  }
}

async function merkitseValmiiksi(tyo, btn, actionArea) {
  btn.disabled = true;
  btn.textContent = 'Merkitään...';
  try {
    const url = WEBHOOK_URL + '?action=merkitseValmiiksi&id=' + encodeURIComponent(tyo.id) + '&token=' + encodeURIComponent(accessToken);
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.ok) {
      tyo.tila = 'Valmis';
      actionArea.innerHTML = `<div class="badge-tyon-alla" style="background:var(--success-light); color:var(--success); border-color:var(--success);">✅ Valmis</div>`;
      showToast('Työ merkitty valmiiksi', 'success');
    } else {
      showToast('Virhe: ' + (data.error || 'tuntematon'), 'error');
      btn.disabled = false;
      btn.textContent = '✅ Valmis';
    }
  } catch(e) {
    showToast('Virhe: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = '✅ Valmis';
  }
}

async function ilmoitaPoikkeama(tyo, kuvaus, btn, actionArea) {
  btn.disabled = true;
  btn.textContent = 'Lähetetään...';
  try {
    const resp = await fetch(WEBHOOK_URL + '?action=ilmoitaPoikkeama', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ token: accessToken, id: tyo.id, kuvaus: kuvaus })
    });
    const data = await resp.json();
    if (data.ok) {
      tyo.tila = 'Poikkeama';
      actionArea.innerHTML = `<div class="badge-tyon-alla" style="background:rgba(255,81,38,0.12); color:var(--danger); border-color:var(--danger);">⚠️ Poikkeama ilmoitettu</div>`;
      showToast('Poikkeama ilmoitettu', 'success');
    } else {
      showToast('Virhe: ' + (data.error || 'tuntematon'), 'error');
      btn.disabled = false;
      btn.textContent = 'Lähetä poikkeama';
    }
  } catch(e) {
    showToast('Virhe: ' + e.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Lähetä poikkeama';
  }
}
</script>
