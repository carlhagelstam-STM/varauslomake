<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STM Varauskeskus</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #1c1c1c;
    --surface: #2a2a2a;
    --surface2: #303131;
    --surface3: #3a3a3a;
    --border: #3f3f40;
    --border2: #4e4e4f;
    --text: #f0f0f0;
    --text2: #aaaaaa;
    --text3: #888586;
    --accent: #E50420;
    --accent-hover: #c4261b;
    --success: #2c901e;
    --success-light: #0d2210;
    --danger: #ff5126;
    --warning: #fbbf24;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }

  header {
    position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 700; }
  #auth-btn { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; cursor: pointer; }
  #auth-btn.signed-in { color: var(--success); border-color: var(--success); }

  /* ── TOIMIPISTE- JA NÄKYMÄPALKKI ── */
  #control-bar {
    position: sticky; top: 53px; z-index: 19; background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  #piste-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .piste-btn {
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 7px 12px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .piste-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .piste-btn.kaikki-btn { border-color: var(--border2); font-weight: 700; }
  .piste-btn.kaikki-btn.active { background: var(--surface3); color: var(--text); border-color: var(--text2); }
  .piste-btn { cursor: grab; user-select: none; touch-action: pan-y; }
  .piste-btn.dragging { opacity: 0.4; cursor: grabbing; }
  .piste-btn.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }

  #view-controls { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .nav-arrow {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border2);
    border-radius: var(--radius); width: 32px; height: 32px; font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  #nav-label { font-weight: 700; font-size: 13px; white-space: nowrap; min-width: 150px; text-align: center; }
  #view-toggle { display: flex; gap: 4px; }
  .view-btn {
    background: var(--surface2); color: var(--text2); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .view-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  #refresh-btn { position: relative; overflow: visible; }
  #refresh-btn #refresh-icon { position: relative; z-index: 1; }
  #refresh-btn.spinning #refresh-icon { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Visuaalinen 60s laskuri: vihreä rengas kasvaa myötäpäivään napin
     ympärillä, kertoen milloin seuraava automaattinen päivitys tapahtuu. */
  #refresh-ring {
    position: absolute; top: -1px; left: -1px; width: 34px; height: 34px;
    transform: rotate(-90deg); pointer-events: none;
  }
  .refresh-ring-bg { fill: none; stroke: var(--border2); stroke-width: 2; opacity: 0.3; }
  .refresh-ring-fg {
    fill: none; stroke: var(--success); stroke-width: 2;
    stroke-dasharray: 87.96; /* 2 * pi * 14 */
    stroke-dashoffset: 87.96;
    stroke-linecap: round;
  }
  .refresh-ring-fg.animoi {
    transition: stroke-dashoffset 60s linear;
    stroke-dashoffset: 0;
  }

  /* ── PÄÄASETTELU: kalenteri + sivupalkki ── */
  #layout { display: flex; gap: 16px; padding: 20px; max-width: 1400px; margin: 0 auto; align-items: flex-start; }
  #calendar-area { flex: 1; min-width: 0; }
  #sidebar {
    width: 260px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 14px; position: sticky; top: 112px;
  }
  #sidebar h2 { font-size: 13px; margin: 0 0 4px; font-weight: 700; }
  #sidebar .sidebar-sub { font-size: 11px; color: var(--text3); margin-bottom: 12px; }
  .sidebar-item {
    border-radius: var(--radius); padding: 8px 10px; margin-bottom: 8px; cursor: pointer;
    font-size: 12px; line-height: 1.4;
  }
  .sidebar-item.poikkeama { background: rgba(255,81,38,0.12); border: 1px solid var(--danger); color: var(--danger); }
  .sidebar-item-title { font-weight: 700; }
  .sidebar-empty { font-size: 12px; color: var(--text3); }

  #status-msg { text-align: center; color: var(--text3); padding: 40px 16px; font-size: 14px; }
  #status-msg.error-msg { color: var(--danger); }

  /* ── PÄIVÄNÄKYMÄ (yhden pisteen) ── */
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { background: var(--surface2); color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  tr.data-row:hover td { background: var(--surface2); cursor: pointer; }

  .tila-badge { padding: 3px 9px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-block; }
  .tila-Varattu { background: var(--surface3); color: var(--text2); }
  .tila-Tyon-alla { background: var(--success-light); color: var(--success); }
  .tila-Valmis { background: var(--success-light); color: var(--success); }
  .tila-Peruutettu { background: rgba(255,81,38,0.12); color: var(--danger); }
  .tila-Poikkeama { background: rgba(255,81,38,0.12); color: var(--danger); }

  .note-dot { color: var(--warning); font-size: 14px; margin-left: 4px; }

  /* ── VIIKKONÄKYMÄ (7 saraketta rinnakkain, ei scrollausta) ── */
  #week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    height: calc(100vh - 160px);
    min-height: 400px;
  }
  .week-col {
    display: flex; flex-direction: column; min-width: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .week-col-heading {
    font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase;
    letter-spacing: 0.04em; padding: 8px 6px; cursor: pointer; border-bottom: 1px solid var(--border);
    text-align: center; flex-shrink: 0;
  }
  .week-col-heading:hover { color: var(--text); }
  .week-col-body {
    flex: 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; gap: 4px; padding: 6px;
  }
  .day-empty { font-size: 11px; color: var(--text3); padding: 4px 2px; text-align: center; }
  .week-tile {
    padding: 6px 7px; border-radius: 6px;
    border: 1px solid var(--border2); cursor: pointer; line-height: 1.25;
    flex-shrink: 0; overflow: hidden;
  }
  .week-tile-rek { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week-tile-sub { font-size: 10px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .week-tile.tile-vaihto { background: #1a3a5c; border-color: #2563eb; color: #93c5fd; }
  .week-tile.tile-korjaus { background: #0d2e2a; border-color: #0f6e56; color: #5eead4; }
  .week-tile.tile-reklamaatio { background: #3a1414; border-color: #dc2626; color: #fca5a5; }
  .week-tile.tile-muu { background: var(--surface2); border-color: var(--border2); color: var(--text2); }
  .week-tile.tile-valmis { background: var(--success-light); border-color: var(--success); color: var(--success); }
  .week-tile.tile-poikkeama { background: rgba(255,81,38,0.12); border-color: var(--danger); color: var(--danger); }
  @media (max-width: 900px) {
    #week-grid { display: flex; flex-direction: column; height: auto; }
    .week-col-body { overflow: visible; }
  }

  /* ── KAIKKI PISTEET -NÄKYMÄ (13.7.2026: päiväkohtainen, sarakkeet) ── */
  #kaikki-pisteet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 6px;
  }
  .kp-col {
    display: flex; flex-direction: column; min-width: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .kp-col-heading {
    font-size: 12px; font-weight: 700; color: var(--text); text-align: center;
    padding: 8px 6px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .kp-col-body {
    flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 6px; min-height: 60px;
  }
  .tile-note-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--warning);
    position: absolute; bottom: 4px; right: 4px;
  }
  .week-tile { position: relative; }

  /* ── MUOKKAUSLOMAKE (modaali) ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
  }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px; max-width: 620px; width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    max-height: calc(100vh - 40px); overflow-y: auto;
  }
  .modal-title {
    font-size: 15px; font-weight: 700; margin-bottom: 14px;
    position: sticky; top: -20px; background: var(--surface); padding-top: 20px; margin-top: -20px;
    z-index: 1;
  }
  .edit-form { display: flex; gap: 10px; flex-wrap: wrap; }
  .edit-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
  .edit-field.full { flex-basis: 100%; }
  .edit-field label { font-size: 10px; text-transform: uppercase; color: var(--text3); letter-spacing: 0.04em; }
  .edit-field input, .edit-field select, .edit-field textarea {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 13px; font-family: inherit; width: 100%;
  }
  .edit-field textarea { min-height: 60px; resize: vertical; }
  .edit-actions {
    display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap;
    position: sticky; bottom: -20px; background: var(--surface);
    padding: 12px 0 20px; margin-bottom: -20px; border-top: 1px solid var(--border);
  }
  .btn-save { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-save:hover { background: var(--accent-hover); }
  .btn-cancel { background: var(--surface3); color: var(--text2); border: none; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .btn-peruuta { background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .btn-peruuta:hover { background: rgba(255,81,38,0.1); }

  /* ── "NÄYTÄ KAIKKI KENTÄT" -OSIO ── */
  .btn-naytakaikki {
    background: none; border: none; color: var(--text2); font-size: 12px; cursor: pointer;
    padding: 8px 0; margin-top: 6px; text-align: left; width: 100%;
  }
  .btn-naytakaikki:hover { color: var(--text); }
  .kaikki-kentat { margin-top: 4px; }
  .kk-osio { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; }
  .kk-otsikko { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kk-lukuarvo {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 13px; color: var(--text2); min-height: 32px;
    display: flex; align-items: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kk-historia-lista { display: flex; flex-direction: column; gap: 4px; max-height: 220px; overflow-y: auto; }
  .kk-historia-rivi {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: var(--text2); line-height: 1.5;
  }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--surface3); color: var(--text); padding: 12px 18px; border-radius: var(--radius); font-size: 14px;
    opacity: 0; transition: all 0.25s ease; z-index: 300; max-width: 90%;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: var(--danger); color: white; }
  #toast.success { background: var(--success); color: white; }

  @media (max-width: 900px) {
    #layout { flex-direction: column; }
    #sidebar { width: 100%; position: static; }
  }
</style>
</head>
<body>

<header>
  <h1>📅 Varauskeskus — kalenterinäkymä</h1>
  <a href="index.html" style="margin-right:10px;text-decoration:none;color:inherit;">🏠 Etusivu</a>
  <a href="#" onclick="kirjauduUlosJaOhjaa(); return false;" style="margin-right:10px;text-decoration:none;color:inherit;">🚪 Kirjaudu ulos</a>
  <button id="auth-btn">Kirjaudu</button>
</header>

<div id="control-bar">
  <div id="piste-tabs"></div>
  <div id="view-controls">
    <button class="nav-arrow" id="nav-prev">‹</button>
    <div id="nav-label"></div>
    <button class="nav-arrow" id="nav-next">›</button>
    <div id="view-toggle">
      <button class="view-btn active" id="view-week">Viikko</button>
      <button class="view-btn" id="view-day">Päivä</button>
    </div>
    <button class="nav-arrow" id="refresh-btn" title="Päivitä nyt">
      <svg id="refresh-ring" viewBox="0 0 32 32" width="32" height="32">
        <circle class="refresh-ring-bg" cx="16" cy="16" r="14" />
        <circle class="refresh-ring-fg" cx="16" cy="16" r="14" />
      </svg>
      <span id="refresh-icon">⟳</span>
    </button>
  </div>
</div>

<div id="layout">
  <div id="calendar-area">
    <div id="status-msg">Kirjaudu sisään nähdäksesi varaukset.</div>
    <div id="calendar-content" style="display:none;"></div>
  </div>

  <div id="sidebar">
    <h2>⚠️ Poikkeukset ja muut tehtävät</h2>
    <div class="sidebar-sub">Päivitetään automaattisesti</div>
    <div id="sidebar-list"><div class="sidebar-empty">Ei poikkeamia juuri nyt.</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── ASETUKSET ─────────────────────────────────────────────────
const CLIENT_ID = '407173392975-daujo79fag2g1si9spljnv6vkct5ccqj.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/userinfo.email';
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbwJD34dyJhcwvp0l2JDwCkB2cVgM2Ue9pWRYQ1jp9xh8z_k9maSv7bkt69ZJgfkc-pN/exec';
const PISTEET_OLETUS = ['TEST','Hatanpää','Kuopio','Lahti','Lempäälä','Lielahti','Pirkkala','Vantaa','Ylöjärvi'];
const TYYPIT = ['Vaihto','Korjaus','Reklamaatio','Muu'];
const TILAT = ['Varattu','Työn alla','Valmis','Peruutettu','Poikkeama'];

// UUSI 13.7.2026: PISTEET ei ole enää vakio, koska käyttäjä voi järjestellä
// napit raahaamalla — järjestys ladataan Drivesta kirjautumisen jälkeen
// (ks. lataaPisteJarjestys). Kunnes se on ladattu, käytetään oletusta.
let PISTEET = PISTEET_OLETUS.slice();

// Laitetyyppi vaikuttaa siihen mikä järjestys tallennetaan/ladataan —
// sama raja-arvo kuin CSS:n @media (max-width: 900px) -breakpoint layoutin
// vaihdolle, jotta "desktop"/"mobile" tarkoittaa samaa asiaa koodissa ja
// tyyleissä.
function nykyinenLaitetyyppi() {
  return window.innerWidth <= 900 ? 'mobile' : 'desktop';
}

let accessToken = null;
let currentUserEmail = null;
let kaikkiVaraukset = [];
let currentPiste = PISTEET[0];
let currentView = 'week';
let currentDate = new Date();
let currentWeekStart = maanantai(new Date());

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  setTimeout(() => { t.className = ''; }, 3000);
}

function fmtDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function lisaaPaivia(d, n) { const uusi = new Date(d); uusi.setDate(uusi.getDate() + n); return uusi; }
function maanantai(d) {
  const uusi = new Date(d);
  const vp = (uusi.getDay() + 6) % 7;
  uusi.setDate(uusi.getDate() - vp);
  return uusi;
}
function tilaLuokka(tila) {
  return 'tila-' + (tila || 'Varattu').replace(/\s+/g, '-');
}
function tileLuokka(v) {
  if (v.tila === 'Poikkeama') return 'tile-poikkeama';
  if (v.tila === 'Valmis') return 'tile-valmis';
  const t = (v.tyyppi || '').toLowerCase();
  if (t === 'vaihto') return 'tile-vaihto';
  if (t === 'korjaus') return 'tile-korjaus';
  if (t === 'reklamaatio') return 'tile-reklamaatio';
  return 'tile-muu';
}

// ── TOIMIPISTENAPIT + RAAHAUS-JÄRJESTELY (13.7.2026) ────────────
// draggedIndex: kesken olevan raahauksen lähdeindeksi PISTEET-taulukossa.
// Kosketuslaitteilla (puhelin) käytetään omaa touch-käsittelyä, koska
// HTML5:n natiivi drag & drop -API ei tue kosketusta luotettavasti.
let draggedIndex = null;
let touchDragEl = null;
let touchDragStartX = 0;

function rakennaPisteTabit() {
  const wrap = document.getElementById('piste-tabs');
  wrap.innerHTML = '';
  PISTEET.forEach((p, idx) => {
    const btn = document.createElement('button');
    btn.className = 'piste-btn' + (p === currentPiste ? ' active' : '');
    btn.textContent = p;
    btn.draggable = true;
    btn.dataset.idx = idx;
    btn.addEventListener('click', (e) => {
      // Raahauksen jälkeinen klikkaus ei saa vaihtaa pistettä vahingossa
      if (btn.dataset.raahattu === '1') { btn.dataset.raahattu = ''; return; }
      vaihdaPiste(p);
    });

    // Hiiri-drag&drop (desktop)
    btn.addEventListener('dragstart', (e) => {
      draggedIndex = idx;
      btn.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    btn.addEventListener('dragend', () => {
      btn.classList.remove('dragging');
      draggedIndex = null;
      wrap.querySelectorAll('.piste-btn').forEach(b => b.classList.remove('drag-over'));
    });
    btn.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (draggedIndex === null || draggedIndex === idx) return;
      btn.classList.add('drag-over');
    });
    btn.addEventListener('dragleave', () => btn.classList.remove('drag-over'));
    btn.addEventListener('drop', (e) => {
      e.preventDefault();
      btn.classList.remove('drag-over');
      if (draggedIndex === null || draggedIndex === idx) return;
      siirraPiste(draggedIndex, idx);
    });

    // Kosketus-raahaus (puhelin/tabletti)
    btn.addEventListener('touchstart', (e) => {
      touchDragEl = btn;
      touchDragStartX = e.touches[0].clientX;
      btn.dataset.raahattu = '';
    }, { passive: true });
    btn.addEventListener('touchmove', (e) => {
      if (!touchDragEl) return;
      const liike = Math.abs(e.touches[0].clientX - touchDragStartX);
      if (liike > 12) {
        btn.dataset.raahattu = '1'; // riittävä liike -> ei tulkita klikkaukseksi
        btn.classList.add('dragging');
      }
      const kosketus = e.touches[0];
      const kohde = document.elementFromPoint(kosketus.clientX, kosketus.clientY);
      wrap.querySelectorAll('.piste-btn').forEach(b => b.classList.remove('drag-over'));
      if (kohde && kohde.classList && kohde.classList.contains('piste-btn') && kohde !== btn) {
        kohde.classList.add('drag-over');
      }
    }, { passive: true });
    btn.addEventListener('touchend', (e) => {
      btn.classList.remove('dragging');
      wrap.querySelectorAll('.piste-btn').forEach(b => b.classList.remove('drag-over'));
      if (btn.dataset.raahattu === '1' && touchDragEl) {
        const kosketus = e.changedTouches[0];
        const kohde = document.elementFromPoint(kosketus.clientX, kosketus.clientY);
        if (kohde && kohde.classList && kohde.classList.contains('piste-btn') && kohde !== btn) {
          const kohdeIdx = parseInt(kohde.dataset.idx, 10);
          siirraPiste(idx, kohdeIdx);
        }
      }
      touchDragEl = null;
    });

    wrap.appendChild(btn);
  });
  const kaikkiBtn = document.createElement('button');
  kaikkiBtn.className = 'piste-btn kaikki-btn' + (currentPiste === '__kaikki__' ? ' active' : '');
  kaikkiBtn.textContent = 'Kaikki pisteet';
  kaikkiBtn.addEventListener('click', () => vaihdaPiste('__kaikki__'));
  wrap.appendChild(kaikkiBtn);
}

// Siirtää pisteen lähdeindeksistä kohdeindeksiin, piirtää napit uudelleen
// ja tallentaa uuden järjestyksen taustalla Driveen. Ei odota tallennusta.
function siirraPiste(lahdeIdx, kohdeIdx) {
  if (lahdeIdx === kohdeIdx) return;
  const uusi = PISTEET.slice();
  const [siirretty] = uusi.splice(lahdeIdx, 1);
  uusi.splice(kohdeIdx, 0, siirretty);
  PISTEET = uusi;
  rakennaPisteTabit();
  tallennaPisteJarjestysTaustalla();
}

async function tallennaPisteJarjestysTaustalla() {
  if (!accessToken) return;
  try {
    await fetch(WEBHOOK_URL + '?action=tallennaPisteJarjestys', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ token: accessToken, laite: nykyinenLaitetyyppi(), jarjestys: PISTEET })
    });
  } catch (e) {
    console.warn('Pistejärjestyksen tallennus epäonnistui (ei kriittistä):', e.message);
  }
}

async function lataaPisteJarjestys() {
  if (!accessToken) return;
  try {
    const url = WEBHOOK_URL + '?action=haePisteJarjestys&token=' + encodeURIComponent(accessToken) + '&laite=' + nykyinenLaitetyyppi();
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.ok && Array.isArray(data.jarjestys) && data.jarjestys.length > 0) {
      // Varmistetaan että tallennettu järjestys sisältää täsmälleen samat
      // pisteet kuin oletusjoukko (esim. jos piste on lisätty/poistettu
      // Koodi.gs:ssä sen jälkeen kun käyttäjä järjesteli viimeksi).
      const tallennetut = data.jarjestys.filter(p => PISTEET_OLETUS.includes(p));
      const puuttuvat = PISTEET_OLETUS.filter(p => !tallennetut.includes(p));
      PISTEET = tallennetut.concat(puuttuvat);
    } else {
      PISTEET = PISTEET_OLETUS.slice();
    }
    currentPiste = PISTEET[0];
    rakennaPisteTabit();
  } catch (e) {
    console.warn('Pistejärjestyksen lataus epäonnistui, käytetään oletusta:', e.message);
  }
}

function vaihdaPiste(p) {
  currentPiste = p;
  rakennaPisteTabit();
  paivitaViewToggleNakyvyys();
  paivitaNavLabel();
  varmistaNakymaLadattu();
}


// "Kaikki pisteet" -näkymä on aina päiväkohtainen (13.7.2026), joten
// Viikko/Päivä-vaihtonappi ei ole silloin tarpeen — piilotetaan se.
function paivitaViewToggleNakyvyys() {
  const toggle = document.getElementById('view-toggle');
  toggle.style.display = (currentPiste === '__kaikki__') ? 'none' : 'flex';
}

function paivitaNavLabel() {
  const label = document.getElementById('nav-label');
  if (currentPiste === '__kaikki__' || currentView === 'day') {
    label.textContent = currentDate.toLocaleDateString('fi-FI', { weekday: 'long', day: 'numeric', month: 'numeric' });
  } else {
    const su = lisaaPaivia(currentWeekStart, 6);
    label.textContent = currentWeekStart.toLocaleDateString('fi-FI', { day: 'numeric', month: 'numeric' })
      + ' – ' + su.toLocaleDateString('fi-FI', { day: 'numeric', month: 'numeric' });
  }
}

// "Kaikki pisteet" -näkymässä navigointi vaihtaa aina päivää (kuten
// Päivä-näkymässä), riippumatta siitä mikä currentView-arvo sattuu olemaan.
function vaihdaSuunta(suunta) {
  if (currentPiste === '__kaikki__' || currentView === 'day') {
    currentDate = lisaaPaivia(currentDate, suunta);
  } else {
    currentWeekStart = lisaaPaivia(currentWeekStart, suunta * 7);
  }
  paivitaNavLabel();
  varmistaNakymaLadattu();
}

function vaihdaNakyma(nakyma) {
  currentView = nakyma;
  document.getElementById('view-week').classList.toggle('active', nakyma === 'week');
  document.getElementById('view-day').classList.toggle('active', nakyma === 'day');
  paivitaNavLabel();
  varmistaNakymaLadattu();
}

document.getElementById('nav-prev').addEventListener('click', () => vaihdaSuunta(-1));
document.getElementById('nav-next').addEventListener('click', () => vaihdaSuunta(1));
document.getElementById('view-week').addEventListener('click', () => vaihdaNakyma('week'));
document.getElementById('view-day').addEventListener('click', () => vaihdaNakyma('day'));

// Ikkunan koon muuttuessa (esim. selain venytetään/pienennetään) lasketaan
// viikkonäkymän laatikkokoko uusiksi, jotta koko viikko mahtuu edelleen
// näytölle ilman scrollausta. Pieni viive (debounce) ettei piirretä joka
// yksittäisellä pikselillä kesken venytyksen.
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (currentView === 'week' && currentPiste !== '__kaikki__' && kaikkiVaraukset.length >= 0 && accessToken) {
      renderoiKalenteri();
    }
  }, 200);
});

function kirjauduUlosJaOhjaa() {
  sessionStorage.removeItem('stm_istunto');
  sessionStorage.removeItem('stm_email');
  window.location.href = 'index.html';
}

// Kutsutaan aina kun Apps Scriptiltä saadaan vastaus — jos palvelin
// sanoo istunnon vanhentuneen, ohjataan käyttäjä takaisin kirjautumaan
// sen sijaan että näytetään pelkkä rikkinäinen virhe.
function tarkistaIstuntoVirhe(vastausData) {
  if (vastausData && vastausData.ok === false &&
      /kirjautuminen|istunto/i.test(vastausData.error || '')) {
    showToast('Istunto on vanhentunut, kirjaudu uudelleen.', 'error');
    setTimeout(kirjauduUlosJaOhjaa, 1500);
    return true;
  }
  return false;
}

function initGoogleAuth() {
  const istuntoId = sessionStorage.getItem('stm_istunto');
  if (!istuntoId) {
    window.location.href = 'index.html';
    return;
  }
  accessToken = istuntoId; // istuntoId toimii kaikkialla missä ennen oli Google-token
  const btn = document.getElementById('auth-btn');
  if (btn) btn.style.display = 'none'; // ei tarvita enää — kirjautuminen on jo automaattista

  // UUSI 15.7.2026: istunto löytyi heti (sessionStorage on synkroninen), mutta
  // itse datan lataus (haeOmaEmail, lataaPisteJarjestys, lataaVaraukset) vie
  // muutaman sekunnin Airtable-kutsujen takia. Sinä aikana staattinen
  // "Kirjaudu sisään" -teksti näytti harhaanjohtavasti siltä, ettei käyttäjä
  // ollut kirjautunut, vaikka istunto oli jo tunnistettu. Päivitetään teksti
  // heti tässä kertomaan rehellisesti että ladataan, ei että pitäisi kirjautua.
  const statusMsg = document.getElementById('status-msg');
  if (statusMsg) statusMsg.textContent = 'Ladataan varauksia...';

  (async () => {
    await haeOmaEmail();
    await lataaPisteJarjestys();
    paivitaViewToggleNakyvyys();
    paivitaNavLabel();
    await lataaVaraukset();
  })();
}
initGoogleAuth();

async function haeOmaEmail() {
  currentUserEmail = (sessionStorage.getItem('stm_email') || '').toLowerCase() || null;
}

// ── DATAN HAKU (13.7.2026, uudistettu suorituskyvyn vuoksi) ────────────
// kaikkiVaraukset sisältää VAIN ladattujen ajanjaksojen peruskentät.
// ladatutValit pitää kirjaa mitkä [alku,loppu]-välit on jo haettu, jottei
// samaa väliä ladata turhaan uudelleen. lisatiedotCache sisältää id -> 
// {asiakas, auto, vakuutus} kun ne on haettu (joko yksittäin modaalista
// tai koosteena taustalatauksesta).
let ladatutValit = []; // [{alku, loppu}]
let lisatiedotCache = {};

function valiOnLadattu(alku, loppu) {
  return ladatutValit.some(v => alku >= v.alku && loppu <= v.loppu);
}

// Hakee yhden aikavälin varaukset ja lisää ne kaikkiVaraukset-muistiin
// (korvaa saman id:n rivin jos se on jo olemassa, lisää muuten).
async function haeJaLisaaVali(alku, loppu, hiljaa) {
  if (valiOnLadattu(alku, loppu)) return;
  try {
    const url = WEBHOOK_URL + '?action=haeVaraukset&token=' + encodeURIComponent(accessToken)
      + '&alku=' + alku + '&loppu=' + loppu;
    const resp = await fetch(url);
    const data = await resp.json();
    if (!data.ok) {
      if (!hiljaa) showToast('Hakuvirhe: ' + (data.error || 'tuntematon'), 'error');
      return;
    }
    (data.varaukset || []).forEach(uusi => {
      const idx = kaikkiVaraukset.findIndex(x => x.id === uusi.id);
      if (idx !== -1) kaikkiVaraukset[idx] = Object.assign({}, kaikkiVaraukset[idx], uusi);
      else kaikkiVaraukset.push(uusi);
    });
    ladatutValit.push({ alku, loppu });
  } catch (e) {
    if (!hiljaa) showToast('Hakuvirhe: ' + e.message, 'error');
  }
}

// UUSI 17.7.2026: käyttää index.html:n kirjautumishetkellä taustalla
// hakemaa dataa (sessionStorage-avain stm_esilataus_varaukset), jos sitä
// löytyy ja se on tuoretta (alle 5 min) ja kattaa täsmälleen nykyisen
// näkymän ajanjakson (viikko, koska index.html esilataa aina ma-su).
// Syöttää esiladatun datan samaan kaikkiVaraukset/ladatutValit-rakenteeseen
// kuin normaali haku, jotta loppu piirtologiikka toimii muuttumattomana.
// Kertakäyttöinen — poistaa avaimen heti käytön jälkeen.
function kayttaEsilattuaDataaJosLoytyy(alku, loppu) {
  const raaka = sessionStorage.getItem('stm_esilataus_varaukset');
  if (!raaka) return false;
  sessionStorage.removeItem('stm_esilataus_varaukset'); // kertakäyttöinen riippumatta tuloksesta

  let data;
  try {
    data = JSON.parse(raaka);
  } catch (e) {
    return false;
  }

  const ika = Date.now() - new Date(data.aikaleima).getTime();
  const VANHENTUMISAIKA_MS = 5 * 60 * 1000; // 5 min
  if (ika > VANHENTUMISAIKA_MS) return false;
  if (data.alku !== alku || data.loppu !== loppu) return false; // ei täsmää nykyiseen näkymään

  (data.varaukset || []).forEach(uusi => {
    const idx = kaikkiVaraukset.findIndex(x => x.id === uusi.id);
    if (idx !== -1) kaikkiVaraukset[idx] = Object.assign({}, kaikkiVaraukset[idx], uusi);
    else kaikkiVaraukset.push(uusi);
  });
  ladatutValit.push({ alku, loppu });
  return true;
}

// Ensimmäinen, NOPEA lataus: vain se ajanjakso mitä käyttäjä katsoo juuri
// nyt. Piirtää kalenterin heti kun tämä on valmis, sitten käynnistää
// taustalatauksen viereisille ajanjaksoille (ei odoteta).
async function lataaVaraukset() {
  const statusEl = document.getElementById('status-msg');

  const [alku, loppu] = nykyinenNakymaVali();

  // Kokeillaan ensin esiladattua dataa — jos se täsmää tarkalleen tähän
  // väliin, kalenteri voidaan piirtää heti ilman "Haetaan varauksia..."
  // -välkähdystä, mutta silti haetaan tuorein data hiljaa taustalla perään.
  const esilatausNaytettiin = kayttaEsilattuaDataaJosLoytyy(alku, loppu);

  if (esilatausNaytettiin) {
    statusEl.style.display = 'none';
    document.getElementById('calendar-content').style.display = 'block';
    renderoiKalenteri();
    renderoiSivupalkkiTaustalla();
    lataaLisatiedotTaustalla();
  } else {
    statusEl.style.display = 'block';
    statusEl.className = '';
    statusEl.textContent = 'Haetaan varauksia...';
    document.getElementById('calendar-content').style.display = 'none';
  }

  // Jos esilataus jo näytti tämän välin, ladatutValit sisältää sen jo —
  // haeJaLisaaVali ei tee mitään turhaa (valiOnLadattu palauttaa true),
  // paitsi jos halutaan varmistaa tuoreus. Koska esilataus voi olla jopa
  // 5 min vanhaa, haetaan tässä silti kerran hiljaa varmuuden vuoksi.
  if (esilatausNaytettiin) {
    ladatutValit = ladatutValit.filter(v => !(v.alku === alku && v.loppu === loppu));
    await haeJaLisaaVali(alku, loppu, true);
    renderoiKalenteri();
  } else {
    await haeJaLisaaVali(alku, loppu, false);
    statusEl.style.display = 'none';
    document.getElementById('calendar-content').style.display = 'block';
    renderoiKalenteri();
    renderoiSivupalkkiTaustalla();
    lataaLisatiedotTaustalla();
  }

  // Taustalataus viereisille ajanjaksoille — ei odoteta, ei estä käyttöä.
  lataaViereisetTaustalla();

  aloitaAutomaattinenPaivitys();
}

// ── AUTOMAATTINEN JA MANUAALINEN PÄIVITYS (13.7.2026) ──────────────────
// Näkyvissä oleva data (kalenteri + poikkeukset) ei muutu automaattisesti
// esim. kun asentaja merkitsee työn valmiiksi asentaja.html:ssä. Tämä
// haluttiin tuoreeksi ilman koko sivun uudelleenlatausta: 60 sekunnin
// välein tapahtuva hiljainen taustapäivitys NYKYISELLE näkymälle, plus
// manuaalinen ⟳-nappi joka tekee saman heti. Molemmat OHITTAVAT
// ladatutValit-muistin nykyisen ajanjakson osalta (muuten uudelleenhaku
// ei tapahtuisi koskaan, ks. valiOnLadattu).
//
// VÄLIAIKAISESTI POIS PÄÄLTÄ (15.7.2026, Carl): Airtablen ilmaistason
// 1000 API-kutsua/kk -raja ylittyi (7145/1000 havaittu). Automaattinen
// 60s-sykli oli suurin yksittäinen syy — laskettu ~2400 kutsua/päivä per
// avoin ikkuna. Pysäytetty kehitystyön ajaksi. Manuaalinen ⟳-nappi toimii
// edelleen normaalisti. KUN OTETAAN TAKAISIN KÄYTTÖÖN: harkitse pidempää
// väliä (esim. 15 min = 900000 ms) 60s sijaan.
const PAIVITYS_VALI_MS = 60000;
let paivitysAjastin = null;

function aloitaAutomaattinenPaivitys() {
  return; // VÄLIAIKAISESTI POIS PÄÄLTÄ — ks. selitys yllä
  // eslint-disable-next-line no-unreachable
  if (paivitysAjastin) return; // jo käynnissä, ei aloiteta kahdesti
  paivitysAjastin = setInterval(() => paivitaNytTuoreesti(true), PAIVITYS_VALI_MS);
  kaynnistaRengasLaskuri();
}

// Käynnistää (tai nollaa ja käynnistää uudelleen) 60s visuaalisen laskurin
// refresh-napin ympärillä. CSS-transition ei suostu käynnistymään uudelleen
// samalta loppuarvolta ilman "reflow-pakotusta" (poista luokka, pakota
// selain lukemaan tila, lisää luokka takaisin) — siksi tämä pieni temppu.
function kaynnistaRengasLaskuri() {
  const rengas = document.querySelector('.refresh-ring-fg');
  if (!rengas) return;
  rengas.classList.remove('animoi');
  void rengas.getBoundingClientRect(); // pakottaa selaimen "reflow'n"
  rengas.classList.add('animoi');
}

// hiljaa=true: ei näytä "Päivitetään..." tilaa, ei virheilmoituksia (taustalla
// tapahtuva automaattinen päivitys). hiljaa=false: napista klikattu, näytetään
// pyörivä ikoni ja mahdolliset virheet.
async function paivitaNytTuoreesti(hiljaa) {
  if (!accessToken) return;
  const btn = document.getElementById('refresh-btn');
  if (!hiljaa && btn) btn.classList.add('spinning');

  const [alku, loppu] = nykyinenNakymaVali();
  // Poistetaan nykyinen väli ladatutValit-muistista, jotta haeJaLisaaVali
  // oikeasti hakee sen uudelleen sen sijaan että toteaisi "jo ladattu".
  ladatutValit = ladatutValit.filter(v => !(v.alku === alku && v.loppu === loppu));
  await haeJaLisaaVali(alku, loppu, hiljaa);
  renderoiKalenteri();
  renderoiSivupalkkiTaustalla();

  if (!hiljaa && btn) {
    setTimeout(() => btn.classList.remove('spinning'), 300);
    showToast('Päivitetty', 'success');
  }

  // Manuaalinen päivitys (napista) nollaa myös automaattisen 60s-syklin,
  // jotta rengas ja oikea seuraava päivitys pysyvät synkassa keskenään.
  // VÄLIAIKAISESTI POIS PÄÄLTÄ (15.7.2026) — ks. selitys aloitaAutomaattinenPaivitys-funktion
  // yhteydessä. Ajastinta ei käynnistetä täältäkään kehitystyön ajaksi.
  if (!hiljaa && false) {
    if (paivitysAjastin) clearInterval(paivitysAjastin);
    paivitysAjastin = setInterval(() => paivitaNytTuoreesti(true), PAIVITYS_VALI_MS);
  }
  kaynnistaRengasLaskuri();
}

document.getElementById('refresh-btn').addEventListener('click', () => paivitaNytTuoreesti(false));

// Palauttaa [alku, loppu] -päivämääräparin sen mukaan mitä näkymää
// käyttäjä katsoo juuri nyt (viikko/päivä/kaikki pisteet on aina päivä).
function nykyinenNakymaVali() {
  if (currentPiste === '__kaikki__' || currentView === 'day') {
    const d = fmtDate(currentDate);
    return [d, d];
  }
  return [fmtDate(currentWeekStart), fmtDate(lisaaPaivia(currentWeekStart, 6))];
}

// Lataa taustalla viereiset ajanjaksot (edellinen/seuraava viikko tai päivä
// riippuen näkymästä), jotta navigointi tuntuu nopealta kun käyttäjä siirtyy
// eteen/taakse. Ei näytä virheitä käyttäjälle (hiljainen tausta-apuri).
async function lataaViereisetTaustalla() {
  if (currentPiste === '__kaikki__' || currentView === 'day') {
    const edellinen = fmtDate(lisaaPaivia(currentDate, -1));
    const seuraava = fmtDate(lisaaPaivia(currentDate, 1));
    await haeJaLisaaVali(edellinen, edellinen, true);
    await haeJaLisaaVali(seuraava, seuraava, true);
  } else {
    const edellinenAlku = fmtDate(lisaaPaivia(currentWeekStart, -7));
    const edellinenLoppu = fmtDate(lisaaPaivia(currentWeekStart, -1));
    const seuraavaAlku = fmtDate(lisaaPaivia(currentWeekStart, 7));
    const seuraavaLoppu = fmtDate(lisaaPaivia(currentWeekStart, 13));
    await haeJaLisaaVali(edellinenAlku, edellinenLoppu, true);
    await haeJaLisaaVali(seuraavaAlku, seuraavaLoppu, true);
  }
}

// Kutsutaan aina kun näkymä/ajanjakso vaihtuu (nuolet, viikko/päivä-vaihto,
// piste-vaihto). Lataa nykyisen ajanjakson jos sitä ei vielä ole, piirtää
// heti sen jälkeen, ja käynnistää taustalatauksen viereisille.
async function varmistaNakymaLadattu() {
  const [alku, loppu] = nykyinenNakymaVali();
  if (!valiOnLadattu(alku, loppu)) {
    await haeJaLisaaVali(alku, loppu, false);
  }
  renderoiKalenteri();
  lataaLisatiedotTaustalla();
  lataaViereisetTaustalla();
}

// ── LISÄTIETOJEN TAUSTALATAUS (asiakas/auto/lasi/vakuutus) ─────────────
// Hakee lisätiedot KOOSTEENA (yksi kutsu per taulu, ei per rivi) kaikille
// näkyvissä oleville varauksille joilta lisätiedot vielä puuttuvat. Näin
// "Näytä kaikki kentät" -osio on useimmiten valmiiksi täytetty kun käyttäjä
// avaa modaalin, ilman erillistä odotusta.
async function lataaLisatiedotTaustalla() {
  const puuttuvat = kaikkiVaraukset
    .filter(v => !lisatiedotCache[v.id])
    .map(v => v.id);
  if (puuttuvat.length === 0) return;
  try {
    const url = WEBHOOK_URL + '?action=haeLisatietoKooste&token=' + encodeURIComponent(accessToken)
      + '&ids=' + encodeURIComponent(puuttuvat.join(','));
    const resp = await fetch(url);
    const data = await resp.json();
    if (!data.ok) return;
    Object.assign(lisatiedotCache, data.lisatiedot || {});
  } catch (e) {
    console.warn('Lisätietojen taustalataus epäonnistui (ei kriittistä):', e.message);
  }
}

// Hakee yhden varauksen lisätiedot jos niitä ei vielä ole cachessa —
// käytetään muokkausmodaalin "Näytä kaikki kentät" -klikkauksessa varmuuden
// vuoksi, jos taustalataus ei ehtinyt valmiiksi.
async function varmistaLisatiedot(id) {
  if (lisatiedotCache[id]) return lisatiedotCache[id];
  try {
    const url = WEBHOOK_URL + '?action=haeVarausLisatiedot&token=' + encodeURIComponent(accessToken) + '&id=' + encodeURIComponent(id);
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.ok) {
      lisatiedotCache[id] = data.lisatiedot;
      return data.lisatiedot;
    }
  } catch (e) {
    console.warn('Lisätietojen haku epäonnistui:', e.message);
  }
  return { asiakas: null, auto: null, vakuutus: null };
}
</script>

<script>
// ── KALENTERIN PIIRTO ─────────────────────────────────────────
function renderoiKalenteri() {
  const cont = document.getElementById('calendar-content');
  cont.innerHTML = '';

  if (currentPiste === '__kaikki__') {
    renderoiKaikkiPisteetPaivittain(cont);
  } else if (currentView === 'day') {
    renderoiPaivaNakyma(cont, currentDate, currentPiste);
  } else {
    renderoiViikkoNakyma(cont, currentPiste);
  }
}

function suodataPisteella(piste, alkuPvm, loppuPvm) {
  return kaikkiVaraukset.filter(v => {
    if (piste && v.piste !== piste) return false;
    const pvm = (v.paivamaara || '').substring(0, 10);
    if (alkuPvm && pvm < alkuPvm) return false;
    if (loppuPvm && pvm > loppuPvm) return false;
    return true;
  });
}

// ── PÄIVÄNÄKYMÄ (yksi piste, taulukkona) ──────────────────────
function renderoiPaivaNakyma(cont, paiva, piste) {
  const avain = fmtDate(paiva);
  const tyot = suodataPisteella(piste, avain, avain)
    .sort((a, b) => (a.kellonaika || '').localeCompare(b.kellonaika || ''));

  if (tyot.length === 0) {
    cont.innerHTML = '<div class="day-empty">Ei töitä tälle päivälle.</div>';
    return;
  }

  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th>Klo</th><th>Varausnumero</th><th>Tyyppi</th><th>Rekisteri</th><th>Tila</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody = table.querySelector('tbody');
  tyot.forEach(v => tbody.appendChild(renderoiTaulukkoRivi(v)));
  cont.appendChild(table);
}

function renderoiTaulukkoRivi(v) {
  const tr = document.createElement('tr');
  tr.className = 'data-row';
  const onLisatietoja = v.lisatiedot && v.lisatiedot.trim();
  tr.innerHTML = `
    <td data-label="Klo">${v.kellonaika || ''}</td>
    <td data-label="Varausnumero">${v.varausnumero || ''}${onLisatietoja ? '<span class="note-dot" title="Lisätietoja">📝</span>' : ''}</td>
    <td data-label="Tyyppi">${v.tyyppi || ''}</td>
    <td data-label="Rekisteri">${v.rekisteri || ''}</td>
    <td data-label="Tila"><span class="tila-badge ${tilaLuokka(v.tila)}">${v.tila || ''}</span></td>
  `;
  tr.addEventListener('click', () => avaaMuokkausModaali(v));
  return tr;
}

// ── VIIKKONÄKYMÄ (yksi piste, 7 saraketta rinnakkain, ei scrollausta) ──
// Laatikoiden koko lasketaan sen päivän mukaan jolla on eniten töitä,
// jotta koko viikko mahtuu näytölle ilman scrollausta.
function renderoiViikkoNakyma(cont, piste) {
  const grid = document.createElement('div');
  grid.id = 'week-grid';

  const paivatJaTyot = [];
  let maxTyotYhdellaPaivalla = 1;
  for (let i = 0; i < 7; i++) {
    const paiva = lisaaPaivia(currentWeekStart, i);
    const avain = fmtDate(paiva);
    const paivanTyot = suodataPisteella(piste, avain, avain)
      .sort((a, b) => (a.kellonaika || '').localeCompare(b.kellonaika || ''));
    paivatJaTyot.push({ paiva, paivanTyot });
    if (paivanTyot.length > maxTyotYhdellaPaivalla) maxTyotYhdellaPaivalla = paivanTyot.length;
  }

  // Arvioitu sarakkeen korkeus pikseleinä (samasta CSS-kaavasta kuin #week-grid)
  const kaytettavaKorkeus = Math.max(window.innerHeight - 220, 300);
  // Jaetaan käytettävä korkeus töiden määrällä -> laatikon korkeus per työ.
  // Rajataan järkeviin ääripäihin: ei koskaan liian iso eikä liian pieni.
  let laatikkoKorkeus = Math.floor(kaytettavaKorkeus / maxTyotYhdellaPaivalla) - 4;
  laatikkoKorkeus = Math.max(24, Math.min(54, laatikkoKorkeus));
  const tiiviiMoodi = laatikkoKorkeus < 40; // pienemmässä koossa piilotetaan alarivi

  paivatJaTyot.forEach(({ paiva, paivanTyot }) => {
    const col = document.createElement('div');
    col.className = 'week-col';

    const otsikko = document.createElement('div');
    otsikko.className = 'week-col-heading';
    otsikko.textContent = paiva.toLocaleDateString('fi-FI', { weekday: 'short', day: 'numeric', month: 'numeric' });
    otsikko.addEventListener('click', () => {
      currentDate = paiva;
      vaihdaNakyma('day');
    });
    col.appendChild(otsikko);

    const body = document.createElement('div');
    body.className = 'week-col-body';

    if (paivanTyot.length === 0) {
      const tyhja = document.createElement('div');
      tyhja.className = 'day-empty';
      tyhja.textContent = '—';
      body.appendChild(tyhja);
    } else {
      paivanTyot.forEach(v => body.appendChild(renderoiTile(v, laatikkoKorkeus, tiiviiMoodi)));
    }

    col.appendChild(body);
    grid.appendChild(col);
  });

  cont.appendChild(grid);
}

// korkeusPx ja tiivis ovat valinnaisia: kaikki pisteet -näkymä kutsuu ilman
// niitä (käyttää CSS-oletuskokoa), viikkonäkymä antaa lasketun koon jotta
// koko viikko mahtuu näytölle ilman scrollausta.
function renderoiTile(v, korkeusPx, tiivis) {
  const tile = document.createElement('div');
  tile.className = 'week-tile ' + tileLuokka(v);
  if (korkeusPx) {
    tile.style.height = korkeusPx + 'px';
    tile.style.display = 'flex';
    tile.style.flexDirection = 'column';
    tile.style.justifyContent = 'center';
  }
  const alarivi = v.tila === 'Poikkeama' ? 'Poikkeama' : (v.tila === 'Valmis' ? 'Valmis' : (v.tyyppi || ''));
  const onLisatietoja = v.lisatiedot && v.lisatiedot.trim();
  if (tiivis) {
    // Hyvin pieni laatikko: näytetään vain rekisteri/varausnumero, ei alariviä
    tile.innerHTML = `<div class="week-tile-rek">${v.rekisteri || v.varausnumero || '—'}</div>${onLisatietoja ? '<div class="tile-note-dot"></div>' : ''}`;
    tile.title = (v.kellonaika || '') + ' · ' + alarivi;
  } else {
    tile.innerHTML = `
      <div class="week-tile-rek">${v.rekisteri || v.varausnumero || '—'}</div>
      <div class="week-tile-sub">${v.kellonaika || ''} · ${alarivi}</div>
      ${onLisatietoja ? '<div class="tile-note-dot"></div>' : ''}
    `;
  }
  tile.addEventListener('click', () => avaaMuokkausModaali(v));
  return tile;
}

// ── KAIKKI PISTEET -NÄKYMÄ (13.7.2026: PÄIVÄKOHTAINEN, ei enää viikko) ──
// Yksi päivä kerrallaan, kaikki pisteet rinnakkain. Piste-otsikko, sen
// alla ruudukko jossa yksi ruutu = yksi varaus (rekisteri, klo, tyyppi),
// väritys tilan mukaan (sama tileLuokka-logiikka kuin muualla), keltainen
// pallo alakulmassa jos lisätietoja.
function renderoiKaikkiPisteetPaivittain(cont) {
  const avain = fmtDate(currentDate);

  const grid = document.createElement('div');
  grid.id = 'kaikki-pisteet-grid';

  let jotainNaytettavaa = false;
  PISTEET.forEach(piste => {
    const tyot = suodataPisteella(piste, avain, avain)
      .sort((a, b) => (a.kellonaika || '').localeCompare(b.kellonaika || ''));

    const col = document.createElement('div');
    col.className = 'kp-col';
    const otsikko = document.createElement('div');
    otsikko.className = 'kp-col-heading';
    otsikko.textContent = piste;
    col.appendChild(otsikko);

    const body = document.createElement('div');
    body.className = 'kp-col-body';
    if (tyot.length === 0) {
      const tyhja = document.createElement('div');
      tyhja.className = 'day-empty';
      tyhja.textContent = '—';
      body.appendChild(tyhja);
    } else {
      jotainNaytettavaa = true;
      tyot.forEach(v => body.appendChild(renderoiTile(v)));
    }
    col.appendChild(body);
    grid.appendChild(col);
  });

  cont.appendChild(grid);
  if (!jotainNaytettavaa) {
    const huom = document.createElement('div');
    huom.className = 'day-empty';
    huom.style.marginTop = '8px';
    huom.textContent = 'Ei töitä yhdelläkään pisteellä tänä päivänä.';
    cont.appendChild(huom);
  }
}

// ── SIVUPALKKI: POIKKEUKSET ────────────────────────────────────
// UUSI 13.7.2026: poikkeamia EI voi enää suodattaa suoraan kaikkiVaraukset-
// muistista, koska se sisältää vain ladatut ajanjaksot. Haetaan siis oma,
// erillinen kevyt kysely joka hakee KAIKKI poikkeamat riippumatta siitä
// mitä ajanjaksoa kalenterissa katsotaan juuri nyt (kuten aiemminkin
// sovittu — poikkeukset-sivupalkkia ei rajata).
async function renderoiSivupalkkiTaustalla() {
  const list = document.getElementById('sidebar-list');
  try {
    const url = WEBHOOK_URL + '?action=haeVaraukset&token=' + encodeURIComponent(accessToken)
      + '&tilaSuodatin=Poikkeama';
    const resp = await fetch(url);
    const data = await resp.json();
    if (!data.ok) return;
    const poikkeamat = (data.varaukset || []).filter(v => v.tila === 'Poikkeama');

    if (poikkeamat.length === 0) {
      list.innerHTML = '<div class="sidebar-empty">Ei poikkeamia juuri nyt.</div>';
      return;
    }

    list.innerHTML = '';
    poikkeamat.forEach(v => {
      const item = document.createElement('div');
      item.className = 'sidebar-item poikkeama';
      item.innerHTML = `
        <div class="sidebar-item-title">${v.rekisteri || v.varausnumero || '—'}</div>
        <div>${v.piste || ''} · ${v.paivamaara || ''}</div>
      `;
      // Poikkeaman klikkaus avaa modaalin — varmistetaan että varaus on
      // myös kaikkiVaraukset-muistissa (lisätään jos puuttuu), jotta
      // muokkausmodaali toimii normaalisti.
      item.addEventListener('click', () => {
        const idx = kaikkiVaraukset.findIndex(x => x.id === v.id);
        if (idx === -1) kaikkiVaraukset.push(v);
        else kaikkiVaraukset[idx] = Object.assign({}, kaikkiVaraukset[idx], v);
        avaaMuokkausModaali(kaikkiVaraukset.find(x => x.id === v.id));
      });
      list.appendChild(item);
    });
  } catch (e) {
    console.warn('Poikkeukset-sivupalkin lataus epäonnistui:', e.message);
  }
}
</script>

<script>
// ── MUOKKAUSLOMAKE (modaali) ──────────────────────────────────
function avaaMuokkausModaali(v) {
  document.querySelectorAll('.modal-overlay').forEach(el => el.remove());

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <div class="modal-title">${v.varausnumero || v.rekisteri || 'Varaus'}</div>
      <div class="edit-form">
        <div class="edit-field">
          <label>Päivämäärä</label>
          <input type="date" class="f-pvm" value="${(v.paivamaara || '').substring(0,10)}" />
        </div>
        <div class="edit-field">
          <label>Kellonaika</label>
          <input type="text" class="f-klo" value="${v.kellonaika || ''}" placeholder="HH:MM" />
        </div>
        <div class="edit-field">
          <label>Tyyppi</label>
          <select class="f-tyyppi">
            ${TYYPIT.map(t => `<option value="${t}" ${t === v.tyyppi ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="edit-field">
          <label>Tila</label>
          <select class="f-tila">
            ${TILAT.map(t => `<option value="${t}" ${t === v.tila ? 'selected' : ''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="edit-field full">
          <label>Lisätietoja</label>
          <textarea class="f-lisatiedot">${v.lisatiedot || ''}</textarea>
        </div>
      </div>

      <button class="btn-naytakaikki" type="button">▾ Näytä kaikki kentät</button>
      <div class="kaikki-kentat" style="display:none;"></div>

      <div class="edit-actions">
        <button class="btn-save">💾 Tallenna</button>
        <button class="btn-cancel">Peruuta muokkaus</button>
        <button class="btn-peruuta">✕ Peruuta varaus</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  overlay.querySelector('.btn-cancel').addEventListener('click', () => overlay.remove());

  // ── "Näytä kaikki kentät" -toggle ──────────────────────────
  const naytaBtn = overlay.querySelector('.btn-naytakaikki');
  const kaikkiKentatEl = overlay.querySelector('.kaikki-kentat');
  let kaikkiKentatRakennettu = false;

  naytaBtn.addEventListener('click', async () => {
    const auki = kaikkiKentatEl.style.display !== 'none';
    if (auki) {
      kaikkiKentatEl.style.display = 'none';
      naytaBtn.textContent = '▾ Näytä kaikki kentät';
    } else {
      if (!kaikkiKentatRakennettu) {
        // Lisätiedot (asiakas/auto/vakuutus) ovat useimmiten jo taustalla
        // ladattuja cacheen — jos eivät, varmistaLisatiedot hakee ne nyt
        // ja näyttää lyhyen "Ladataan..." -tilan siltä ajalta.
        kaikkiKentatEl.innerHTML = '<div class="kk-lukuarvo">Ladataan…</div>';
        kaikkiKentatEl.style.display = 'block';
        const lisatiedot = await varmistaLisatiedot(v.id);
        Object.assign(v, lisatiedot);
        kaikkiKentatEl.innerHTML = rakennaKaikkiKentatHtml(v);
        kaikkiKentatRakennettu = true;
      }
      kaikkiKentatEl.style.display = 'block';
      naytaBtn.textContent = '▴ Piilota kaikki kentät';
    }
  });

  overlay.querySelector('.btn-save').addEventListener('click', () => {
    const fields = {
      'päivämäärä': overlay.querySelector('.f-pvm').value,
      'kellonaika': overlay.querySelector('.f-klo').value,
      'tyyppi': overlay.querySelector('.f-tyyppi').value,
      'tila': overlay.querySelector('.f-tila').value,
      'Lisätiedot': overlay.querySelector('.f-lisatiedot').value,
    };

    // Lisätään laajennetut kentät VAIN jos "Näytä kaikki kentät" on avattu
    // (muuten kenttiä ei ole DOM:issa eikä niitä saa muutettuakaan)
    // HUOM: rekisterinumero, VIN, merkki, malli ja vuosimalli EIVÄT ole
    // muokattavissa tätä kautta (ks. muistiinpanot 12.7.2026) — jos auto on
    // väärä, oikea tapa on peruuttaa varaus ja tehdä uusi.
    if (kaikkiKentatRakennettu) {
      const g = (cls) => { const el = overlay.querySelector(cls); return el ? el.value : undefined; };
      fields['Hinta']                      = g('.f-hinta') ? parseFloat(g('.f-hinta').replace(',', '.')) || null : null;
      fields['Lisäpalvelut']               = g('.f-lisapalvelut');
      fields['Tarvikkeet']                 = g('.f-tarvikkeet');
      fields['Leasing-yhtiö']              = g('.f-leasing-yhtio');
      fields['Leasing-sopimusnumero']      = g('.f-leasing-sopimus');
      fields['Kuljettajan nimi']           = g('.f-kuljettaja-nimi');
      fields['Kuljettajan puhelin']        = g('.f-kuljettaja-puhelin');
      fields['Työmääräysnumero']           = g('.f-tyomaarays');
      fields['Autoliikkeen yhteyshenkilö'] = g('.f-yhteyshenkilo');
    }

    tallennaMuutos(v.id, fields, overlay);
  });

  overlay.querySelector('.btn-peruuta').addEventListener('click', () => {
    if (!confirm('Peruutetaanko varaus ' + (v.varausnumero || '') + '?')) return;
    tallennaMuutos(v.id, { 'tila': 'Peruutettu' }, overlay);
  });
}

// Rakentaa "Näytä kaikki kentät" -osion HTML:n. Vakuutus- ja asiakastiedot
// ovat VAIN LUKU -tilassa (ei input-kenttiä), koska niiden muokkaus vaatii
// erillisen tallennuslogiikan (asiakas/auto-linkit, eri Airtable-taulu).
function rakennaKaikkiKentatHtml(v) {
  const auto = v.auto || {};
  const asiakas = v.asiakas || {};
  const vakuutus = v.vakuutus || null;

  const asiakasNimi = asiakas.yritysNimi
    ? asiakas.yritysNimi
    : [asiakas.etunimi, asiakas.sukunimi].filter(Boolean).join(' ');

  return `
    <div class="kk-osio">
      <div class="kk-otsikko">Ajoneuvo</div>
      <div class="edit-form">
        <div class="edit-field">
          <label>Rekisteri</label>
          <div class="kk-lukuarvo" title="${v.rekisteri || ''}">${v.rekisteri || '—'}</div>
        </div>
        <div class="edit-field" style="min-width:220px;">
          <label>VIN</label>
          <div class="kk-lukuarvo" title="${auto.vin || ''}">${auto.vin || '—'}</div>
        </div>
        <div class="edit-field" style="min-width:200px;">
          <label>Merkki / malli</label>
          <div class="kk-lukuarvo" title="${[auto.merkki, auto.malli].filter(Boolean).join(' ')}">${[auto.merkki, auto.malli].filter(Boolean).join(' ') || '—'}</div>
        </div>
        <div class="edit-field">
          <label>Vuosimalli</label>
          <div class="kk-lukuarvo">${auto.vuosimalli || '—'}</div>
        </div>
        <div class="edit-field">
          <label>Lasikoodi (eurokoodi)</label>
          <div class="kk-lukuarvo" title="${auto.eurokoodi || ''}">${auto.eurokoodi || '—'}</div>
        </div>
      </div>
    </div>

    <div class="kk-osio">
      <div class="kk-otsikko">Asiakas</div>
      <div class="edit-form">
        <div class="edit-field">
          <label>Nimi</label>
          <div class="kk-lukuarvo">${asiakasNimi || '—'}</div>
        </div>
        <div class="edit-field">
          <label>Puhelin</label>
          <div class="kk-lukuarvo">${asiakas.puhelin || '—'}</div>
        </div>
        <div class="edit-field">
          <label>Sähköposti</label>
          <div class="kk-lukuarvo">${asiakas.sahkoposti || '—'}</div>
        </div>
        <div class="edit-field full">
          <label>Osoite</label>
          <div class="kk-lukuarvo">${[asiakas.osoite, asiakas.postinumero, asiakas.kaupunki].filter(Boolean).join(', ') || '—'}</div>
        </div>
      </div>
    </div>

    <div class="kk-osio">
      <div class="kk-otsikko">Autoliike / leasing</div>
      <div class="edit-form">
        <div class="edit-field">
          <label>Leasing-yhtiö</label>
          <input type="text" class="f-leasing-yhtio" value="${v.leasingYhtio || ''}" />
        </div>
        <div class="edit-field">
          <label>Leasing-sopimusnumero</label>
          <input type="text" class="f-leasing-sopimus" value="${v.leasingSopimus || ''}" />
        </div>
        <div class="edit-field">
          <label>Kuljettajan nimi</label>
          <input type="text" class="f-kuljettaja-nimi" value="${v.kuljettajaNimi || ''}" />
        </div>
        <div class="edit-field">
          <label>Kuljettajan puhelin</label>
          <input type="text" class="f-kuljettaja-puhelin" value="${v.kuljettajaPuhelin || ''}" />
        </div>
        <div class="edit-field">
          <label>Työmääräysnumero</label>
          <input type="text" class="f-tyomaarays" value="${v.tyomaarays || ''}" />
        </div>
        <div class="edit-field">
          <label>Yhteyshenkilö</label>
          <input type="text" class="f-yhteyshenkilo" value="${v.yhteyshenkilo || ''}" />
        </div>
      </div>
    </div>

    <div class="kk-osio">
      <div class="kk-otsikko">Tarvikkeet, hinta ja lisäpalvelut</div>
      <div class="edit-form">
        <div class="edit-field">
          <label>Hinta (€)</label>
          <input type="text" class="f-hinta" value="${v.hinta || ''}" />
        </div>
        <div class="edit-field">
          <label>Lisäpalvelut</label>
          <input type="text" class="f-lisapalvelut" value="${v.lisapalvelut || ''}" />
        </div>
        <div class="edit-field full">
          <label>Tarvikkeet</label>
          <textarea class="f-tarvikkeet">${v.tarvikkeet || ''}</textarea>
        </div>
      </div>
    </div>

    ${vakuutus ? `
    <div class="kk-osio">
      <div class="kk-otsikko">Vakuutus (vain luku)</div>
      <div class="edit-form">
        <div class="edit-field">
          <label>Yhtiö</label>
          <div class="kk-lukuarvo">${vakuutus.yhtio || '—'}</div>
        </div>
        <div class="edit-field">
          <label>Vahinkotunnus</label>
          <div class="kk-lukuarvo">${vakuutus.vahinkotunnus || '—'}</div>
        </div>
        <div class="edit-field">
          <label>Vahinkopäivä</label>
          <div class="kk-lukuarvo">${vakuutus.vahinkopaiva || '—'}</div>
        </div>
        <div class="edit-field">
          <label>Omavastuu</label>
          <div class="kk-lukuarvo">${vakuutus.omavastuu !== '' ? vakuutus.omavastuu + ' €' : '—'}</div>
        </div>
        <div class="edit-field">
          <label>Tarkistettu</label>
          <div class="kk-lukuarvo">${vakuutus.tarkistettu ? 'Kyllä' : 'Ei'}</div>
        </div>
      </div>
    </div>` : ''}

    <div class="kk-osio">
      <div class="kk-otsikko">Historia</div>
      ${rakennaHistoriaHtml(v.muokkaushistoria)}
    </div>
  `;
}

// Näyttää Muokkaushistoria-kentän sisällön luettavana listana, uusin rivi
// ylimpänä. Rivit ovat muotoa "dd.mm.yyyy hh:mm — email: kuvaus" (yksi
// rivinvaihdolla erotettu rivi per tapahtuma, ks. Koodi.gs:n
// lisaaMuokkausHistoriaan-funktio).
function rakennaHistoriaHtml(historiaTeksti) {
  if (!historiaTeksti || !historiaTeksti.trim()) {
    return '<div class="kk-lukuarvo">Ei vielä muokkaushistoriaa.</div>';
  }
  const rivit = historiaTeksti.split('\n').filter(r => r.trim()).reverse();
  return '<div class="kk-historia-lista">' +
    rivit.map(rivi => `<div class="kk-historia-rivi">${rivi}</div>`).join('') +
    '</div>';
}

async function tallennaMuutos(id, fields, overlay) {
  try {
    const resp = await fetch(WEBHOOK_URL + '?action=paivitaVaraus', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ token: accessToken, id: id, fields: fields })
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'Tallennus epäonnistui');

    // KORJAUS 13.7.2026: aiemmin tähän oli kovakoodattu vain viisi
    // alkuperäistä kenttää (pvm/klo/tyyppi/tila/lisätiedot), joten kaikki
    // "Näytä kaikki kentät" -tilan uudet kentät (hinta, tarvikkeet, leasing,
    // jne.) EIVÄT päivittyneet paikalliseen muistiin tallennuksen jälkeen —
    // vanha data näkyi kunnes koko sivu ladattiin uudelleen (F5). Korjataan
    // yleisellä Airtable-kenttänimi -> frontend-avain -kartalla, joka kattaa
    // kaikki paivitaVaraus-webhookin sallimat kentät.
    const kentanAvain = {
      'päivämäärä': 'paivamaara',
      'kellonaika': 'kellonaika',
      'tyyppi': 'tyyppi',
      'tila': 'tila',
      'Lisätiedot': 'lisatiedot',
      'Laskun tarkistus': 'laskunTarkistus',
      'Hinta': 'hinta',
      'Lisäpalvelut': 'lisapalvelut',
      'Tarvikkeet': 'tarvikkeet',
      'Leasing-yhtiö': 'leasingYhtio',
      'Leasing-sopimusnumero': 'leasingSopimus',
      'Leasing-lasiturva': 'leasingLasiturva',
      'Kuljettajan nimi': 'kuljettajaNimi',
      'Kuljettajan puhelin': 'kuljettajaPuhelin',
      'Työmääräysnumero': 'tyomaarays',
      'Autoliikkeen yhteyshenkilö': 'yhteyshenkilo',
    };

    const idx = kaikkiVaraukset.findIndex(x => x.id === id);
    if (idx !== -1) {
      const paivitys = {};
      Object.keys(fields).forEach(airtableKentta => {
        const frontendAvain = kentanAvain[airtableKentta];
        if (frontendAvain && fields[airtableKentta] !== undefined) {
          paivitys[frontendAvain] = fields[airtableKentta];
        }
      });
      kaikkiVaraukset[idx] = Object.assign({}, kaikkiVaraukset[idx], paivitys);
    }

    // Historia (Muokkaushistoria-kenttä) ei tule fields-oliossa mukana,
    // koska se päivittyy palvelinpäässä automaattisesti — haetaan siis
    // sen hetkinen varaus uudelleen Airtablesta, jotta Historia-lohko
    // näyttää uusimman rivin heti seuraavalla modaalin avauksella ilman
    // että koko sivua tarvitsee ladata uudelleen (F5).
    paivitaYksittainenVarausTaustalla(id);

    overlay.remove();
    renderoiKalenteri();
    renderoiSivupalkkiTaustalla();
    showToast('Tallennettu', 'success');
  } catch (e) {
    showToast('Virhe: ' + e.message, 'error');
  }
}

// Hakee yhden varauksen tuoreet tiedot taustalla (mm. Muokkaushistoria) ja
// päivittää sen paikalliseen kaikkiVaraukset-muistiin. Ei estä käyttöliittymän
// etenemistä eikä näytä virhettä käyttäjälle jos tämä epäonnistuu — kyseessä
// on vain täydentävä päivitys, ei kriittinen toiminto.
// HUOM 13.7.2026: haeVaraukset-webhook hakee aikavälillä, ei suoraan id:llä,
// joten käytetään varauksen omaa päivämäärää yhden päivän hakuna — tämä
// palauttaa tuoreet peruskentät (mm. Muokkaushistoria) samalla kertaa.
async function paivitaYksittainenVarausTaustalla(id) {
  try {
    const nykyinen = kaikkiVaraukset.find(x => x.id === id);
    const pvm = nykyinen ? (nykyinen.paivamaara || '').substring(0, 10) : '';
    if (!pvm) return;
    const url = WEBHOOK_URL + '?action=haeVaraukset&token=' + encodeURIComponent(accessToken)
      + '&alku=' + pvm + '&loppu=' + pvm;
    const resp = await fetch(url);
    const data = await resp.json();
    if (!data.ok) return;
    const tuore = (data.varaukset || []).find(x => x.id === id);
    if (!tuore) return;
    const idx = kaikkiVaraukset.findIndex(x => x.id === id);
    if (idx !== -1) {
      kaikkiVaraukset[idx] = Object.assign({}, kaikkiVaraukset[idx], tuore);
    }
  } catch (e) {
    console.warn('Yksittäisen varauksen taustapäivitys epäonnistui (ei kriittistä):', e.message);
  }
}
</script>
